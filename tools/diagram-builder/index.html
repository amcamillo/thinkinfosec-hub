<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architecture Diagram Builder — ThinkInfoSec Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── ThinkInfoSec design tokens (single source of truth) ── */
:root {
  --accent:#00BFCF; --accent-strong:#0D1F3C; --accent-soft:rgba(0,191,207,0.14);
  --navy:#0D1F3C;
  --bg:#E9ECF1; --surface:#FFFFFF; --surface-2:#F4F5F7; --border:#DFE1E6;
  --text:#172B4D; --text-secondary:#4a5568; --text-muted:#6B778C;
  /* semantic diagram roles */
  --native:#00BFCF; --hybrid:#FF8B00; --partner:#7C3AED; --services:#FF2D78;
  --ghost:#9aa4b2;
  --mono:'Space Mono', monospace; --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --teal:var(--accent);
}
:root[data-theme="dark"] {
  --accent:#00BFCF; --accent-strong:#5ee0ea; --accent-soft:rgba(0,191,207,0.16);
  --bg:#0D1F3C; --surface:#112240; --surface-2:#0D1F3C; --border:#1A3358;
  --text:#E9ECF1; --text-secondary:#aebdd0; --text-muted:#8BA0B8;
  --native:#00BFCF; --hybrid:#FFAB4A; --partner:#a78bfa; --services:#ff6b9d;
  --ghost:#5a6b82;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--sans); background:var(--bg); color:var(--text); transition:background .2s ease,color .2s ease; }
::selection { background:var(--accent-soft); }

/* ── Shell: header ── */
.header {
  background:var(--surface); color:var(--text);
  border-bottom:1px solid var(--border);
  padding:0.7rem 1.25rem; display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
}
.header-brand { display:flex; align-items:center; gap:0.6rem; text-decoration:none; color:inherit; }
.header-brand img { width:30px; height:30px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 1px var(--border); }
.header-brand .brand-name { font-family:var(--mono); font-size:0.62rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--accent-strong); }
.header-brand:hover .brand-name { color:var(--accent); }
.header h1 { font-family:var(--mono); font-size:0.95rem; font-weight:700; letter-spacing:0.01em; }
.header h1 span { color:var(--accent); }
.header .spacer { margin-left:auto; display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap; }
.template-tabs { display:flex; gap:0.3rem; }
.template-tab {
  font-family:var(--mono); font-size:0.58rem; letter-spacing:0.04em; padding:0.35rem 0.65rem;
  border:1px solid var(--border); border-radius:6px; background:var(--surface);
  color:var(--text-muted); cursor:pointer; transition:all 0.15s; text-transform:uppercase;
}
.template-tab:hover { border-color:var(--accent); color:var(--text); }
.template-tab.active { background:var(--accent); color:#0D1F3C; border-color:var(--accent); font-weight:700; }
.theme-toggle {
  display:inline-flex; align-items:center; gap:0.4rem; font-family:var(--mono); font-size:0.58rem;
  letter-spacing:0.06em; text-transform:uppercase; padding:0.35rem 0.6rem; border-radius:6px;
  border:1px solid var(--border); background:var(--surface); color:var(--text-muted); cursor:pointer; transition:all .15s;
}
.theme-toggle:hover { border-color:var(--accent); color:var(--text); }
.theme-toggle .swatch { width:11px; height:11px; border-radius:50%; background:linear-gradient(135deg,var(--accent) 50%,var(--accent-strong) 50%); box-shadow:0 0 0 1px var(--border); }

.app { display:flex; height:calc(100vh - 53px); }
.sidebar {
  width:264px; min-width:264px; background:var(--surface-2); border-right:1px solid var(--border);
  overflow-y:auto; padding:0.7rem; flex-shrink:0;
}
.sidebar-section { margin-bottom:0.85rem; }
.sidebar-section-title {
  font-family:var(--mono); font-size:0.55rem; text-transform:uppercase; letter-spacing:0.1em;
  color:var(--text-muted); margin-bottom:0.35rem; padding-bottom:0.25rem; border-bottom:1px solid var(--border);
}
.template-desc { font-size:0.68rem; color:var(--text-secondary); line-height:1.45; margin-bottom:0.6rem; }
.block-toggle {
  display:flex; align-items:center; gap:0.4rem; padding:0.2rem 0; cursor:pointer; user-select:none;
}
.block-toggle:hover { opacity:0.85; }
.block-toggle input[type="checkbox"] { accent-color:var(--accent); width:13px; height:13px; cursor:pointer; }
.block-toggle-label { font-size:0.65rem; color:var(--text); line-height:1.2; }
.block-toggle-sub { font-size:0.53rem; color:var(--text-muted); font-family:var(--mono); }
.block-toggle .cov-dot { width:7px; height:7px; border-radius:2px; flex-shrink:0; }
.zone-group { margin-bottom:0.55rem; }
.zone-group-title { font-size:0.57rem; font-weight:600; color:var(--accent-strong); margin-bottom:0.2rem; text-transform:uppercase; letter-spacing:0.04em; }
.canvas-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.canvas-wrapper {
  flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; padding:0.9rem;
  background: repeating-linear-gradient(0deg,transparent,transparent 19px,rgba(120,130,150,0.04) 19px,rgba(120,130,150,0.04) 20px),
    repeating-linear-gradient(90deg,transparent,transparent 19px,rgba(120,130,150,0.04) 19px,rgba(120,130,150,0.04) 20px);
}
#diagramSvg { background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:0 2px 10px rgba(13,31,60,0.08); max-width:100%; height:auto; }
.export-bar {
  background:var(--surface); border-top:1px solid var(--border); padding:0.45rem 1.25rem;
  display:flex; align-items:center; gap:0.45rem; flex-wrap:wrap;
}
.export-bar-label { font-family:var(--mono); font-size:0.55rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-right:0.3rem; }
.export-btn {
  font-family:var(--mono); font-size:0.56rem; letter-spacing:0.04em; padding:0.32rem 0.65rem;
  border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--text-secondary); cursor:pointer; transition:all 0.15s;
}
.export-btn:hover { border-color:var(--accent-strong); color:var(--accent-strong); }
.export-btn.primary { background:var(--accent-strong); color:#fff; border-color:var(--accent-strong); }
.export-btn.primary:hover { background:var(--accent); color:#0D1F3C; border-color:var(--accent); }
.export-btn.active { background:var(--accent); color:#0D1F3C; border-color:var(--accent); font-weight:700; }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(13,31,60,0.6); z-index:100; align-items:center; justify-content:center; }
.modal-overlay.active { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1.25rem; width:90%; max-width:700px; max-height:80vh; overflow-y:auto; box-shadow:0 8px 32px rgba(13,31,60,0.22); }
.modal h3 { font-family:var(--mono); font-size:0.75rem; margin-bottom:0.6rem; color:var(--accent-strong); }
.modal pre { background:var(--navy); color:var(--accent); padding:0.75rem; border-radius:6px; font-family:var(--mono); font-size:0.65rem; line-height:1.6; overflow-x:auto; white-space:pre-wrap; }
.modal-actions { display:flex; gap:0.45rem; margin-top:0.8rem; }
.disclaimer {
  font-size:0.53rem; color:var(--text-muted); line-height:1.4; margin-top:0.5rem;
  padding:0.45rem; background:var(--surface); border-radius:4px; border-left:2px solid var(--hybrid);
}
.tooltip {
  display:none; position:fixed; z-index:200; background:var(--navy); color:#fff;
  padding:8px 12px; border-radius:6px; max-width:300px; pointer-events:none;
  box-shadow:0 4px 16px rgba(13,31,60,0.35); font-family:var(--sans);
}
.tooltip .tip-name { font-size:0.72rem; font-weight:600; margin-bottom:2px; }
.tooltip .tip-sub { font-family:var(--mono); font-size:0.56rem; color:#9fb2c8; margin-bottom:5px; }
.tooltip .tip-badge { display:inline-block; font-family:var(--mono); font-size:0.5rem; padding:1px 6px; border-radius:3px; font-weight:700; }
.tooltip .tip-row { font-size:0.6rem; color:#dbe4ee; margin-top:3px; line-height:1.4; }
@media (max-width:768px) {
  .sidebar { width:210px; min-width:210px; }
  .header .spacer { margin-left:0; }
}
</style>
</head>
<body>
<header class="header">
  <a class="header-brand" href="../../index.html" title="ThinkInfoSec Hub">
    <img src="../../assets/learning-hub-logo.png" alt="ThinkInfoSec Hub" onerror="this.style.display='none'">
    <span class="brand-name">ThinkInfoSec</span>
  </a>
  <h1>Architecture <span>Diagram Builder</span></h1>
  <div class="spacer">
    <div class="template-tabs" id="templateTabs"></div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"><span class="swatch"></span><span id="themeLabel">Dark</span></button>
  </div>
</header>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="canvas-area">
    <div class="canvas-wrapper"><svg id="diagramSvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="export-bar">
      <span class="export-bar-label">Export:</span>
      <button class="export-btn primary" onclick="exportPNG()">PNG</button>
      <button class="export-btn" onclick="exportSVG()">SVG</button>
      <button class="export-btn" onclick="showMermaid()">Mermaid</button>
      <button class="export-btn" onclick="showD2()">D2</button>
      <span style="width:1px;height:16px;background:var(--border);margin:0 4px"></span>
      <button class="export-btn" id="viewToggle" onclick="toggleVolumeView()" style="display:none">Volume view</button>
      <button class="export-btn" onclick="saveConfig()">Save</button>
      <button class="export-btn" onclick="document.getElementById('loadFile').click()">Load</button>
      <input type="file" id="loadFile" accept="application/json,.json" style="display:none" onchange="loadConfig(event)">
      <span style="margin-left:auto;font-size:0.52rem;color:var(--text-muted);font-family:var(--mono)">
        Unofficial CrowdStrike reference — thinkinfosec.org · April 2026
      </span>
    </div>
  </div>
</div>
<div class="modal-overlay" id="codeModal">
  <div class="modal">
    <h3 id="codeModalTitle">Code</h3>
    <pre id="codeModalContent"></pre>
    <div class="modal-actions">
      <button class="export-btn primary" onclick="copyCode()">Copy to Clipboard</button>
      <button class="export-btn" onclick="downloadCode()">Download</button>
      <button class="export-btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="errModal">
  <div class="modal">
    <h3>Could not load diagram</h3>
    <pre id="errModalContent" style="color:#ffb3c6"></pre>
    <div class="modal-actions">
      <button class="export-btn primary" onclick="document.getElementById('errModal').classList.remove('active')">Close</button>
    </div>
  </div>
</div>
<div id="tooltip" class="tooltip"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   LAYER 1 — SCHEMA  (extractable, versioned, no DOM)
   -----------------------------------------------------------------------
   This section is written as if it were a standalone schema module. It is
   pure data + pure functions and can be lifted into its own file later
   with zero changes. Bump SCHEMA_VERSION on any breaking change.
   ═══════════════════════════════════════════════════════════════════════ */
const SCHEMA_VERSION = "2.0";

/** Collection paths — HOW telemetry reaches the platform. */
const PATHS = {
  'sensor-native': { id:'sensor-native', label:'Sensor-native', via:'direct',   desc:'Falcon sensor on the asset' },
  'falcon-shield': { id:'falcon-shield', label:'Falcon Shield', via:'direct',   desc:'Native SaaS / SSPM integration' },
  'connector':     { id:'connector',     label:'Connector',     via:'direct',   desc:'Native NG-SIEM / LogScale connector' },
  'onum':          { id:'onum',          label:'Via Onum',      via:'onum',     desc:'Falcon Onum pipeline — parse/enrich/route' },
  'syslog':        { id:'syslog',        label:'Syslog',        via:'onum',     desc:'Syslog collector into Onum/LogScale' },
  'api-pull':      { id:'api-pull',      label:'API pull',      via:'direct',   desc:'Direct API ingestion' },
};

/** Telemetry sources. paths[] lists supported paths; defaultPath is recommended. */
const SOURCES = [
  { id:'endpoints',   label:'Endpoints',            category:'endpoint', volume:'high', paths:['sensor-native'],                 defaultPath:'sensor-native', ocsfClasses:['Process Activity','File System Activity','Network Activity'], outcomes:['edr-detect','insight'] },
  { id:'identity',    label:'Identity (AD / Entra)',category:'identity', volume:'high', paths:['sensor-native'],                 defaultPath:'sensor-native', ocsfClasses:['Authentication','Account Change'], outcomes:['itdr','insight'] },
  { id:'cloud-work',  label:'Cloud workloads',      category:'cloud',    volume:'med',  paths:['sensor-native'],                 defaultPath:'sensor-native', ocsfClasses:['Process Activity','Network Activity'], outcomes:['cdr','insight'] },
  { id:'cloudtrail',  label:'AWS CloudTrail',       category:'cloud',    volume:'med',  paths:['api-pull','onum'],               defaultPath:'api-pull',      ocsfClasses:['API Activity'], outcomes:['cdr','cloud-posture'] },
  { id:'okta',        label:'Okta / IdP logs',      category:'identity', volume:'med',  paths:['api-pull','onum'],               defaultPath:'api-pull',      ocsfClasses:['Authentication','User Access'], outcomes:['itdr'] },
  { id:'m365',        label:'Microsoft 365',        category:'saas',     volume:'med',  paths:['falcon-shield','connector','onum'], defaultPath:'falcon-shield', ocsfClasses:['Email Activity','File Hosting Activity'], outcomes:['saas-posture','dlp'] },
  { id:'saas-apps',   label:'SaaS apps (generic)',  category:'saas',     volume:'low',  paths:['falcon-shield'],                 defaultPath:'falcon-shield', ocsfClasses:['Application Lifecycle','Config State'], outcomes:['saas-posture'] },
  { id:'firewall',    label:'Firewall / Netflow',   category:'network',  volume:'high', paths:['syslog','onum'],                 defaultPath:'onum',          ocsfClasses:['Network Activity'], outcomes:['network-vis'] },
  { id:'dns',         label:'DNS resolver',         category:'network',  volume:'med',  paths:['syslog','onum'],                 defaultPath:'onum',          ocsfClasses:['DNS Activity'], outcomes:['network-vis'] },
  { id:'ot',          label:'OT / ICS',             category:'ot',       volume:'low',  paths:['syslog','onum'],                 defaultPath:'onum',          ocsfClasses:['Network Activity'], outcomes:['ot-vis'] },
];

/** Pipeline stages (Onum). */
const PIPELINES = [
  { id:'onum', label:'Falcon Onum', stages:['parse','enrich','filter','route'] },
];

/** Destinations. */
const DESTINATIONS = [
  { id:'ngsiem',    label:'NG-SIEM (LogScale)', kind:'ng-siem' },
  { id:'datalake',  label:'Data lake',          kind:'data-lake' },
  { id:'thirdparty',label:'Third-party SIEM',   kind:'third-party-siem' },
];

/** Outcomes — what the telemetry enables. sources[] references Source ids. */
const OUTCOMES = [
  { id:'edr-detect',   label:'Endpoint detection (EDR/XDR)', sources:['endpoints'] },
  { id:'itdr',         label:'Identity threat detection',    sources:['identity','okta'] },
  { id:'cdr',          label:'Cloud detection & response',   sources:['cloud-work','cloudtrail'] },
  { id:'cloud-posture',label:'Cloud posture / API activity', sources:['cloudtrail'] },
  { id:'saas-posture', label:'SaaS security posture (SSPM)', sources:['m365','saas-apps'] },
  { id:'dlp',          label:'Data loss prevention',         sources:['m365'] },
  { id:'network-vis',  label:'Network visibility',           sources:['firewall','dns'] },
  { id:'ot-vis',       label:'OT visibility',                sources:['ot'] },
  { id:'insight',      label:'Cross-domain XDR insight',     sources:['endpoints','identity','cloud-work'] },
];

/** Registry lookup helpers (pure). */
const REG = {
  source: id => SOURCES.find(s => s.id === id),
  path: id => PATHS[id],
  destination: id => DESTINATIONS.find(d => d.id === id),
  outcome: id => OUTCOMES.find(o => o.id === id),
};

/** Resolve the active collection path for a source given user overrides. */
function resolveActivePath(sourceId, overrides) {
  const s = REG.source(sourceId); if (!s) return null;
  const ov = overrides && overrides[sourceId];
  return (ov && s.paths.includes(ov)) ? ov : s.defaultPath;
}

/** Validate + normalize a Diagram config. Returns { ok, config?, errors[] }. */
function normalizeConfig(raw) {
  const errors = [];
  if (!raw || typeof raw !== 'object') { return { ok:false, errors:['File is not a JSON object.'] }; }
  if (raw.version !== SCHEMA_VERSION) errors.push(`Unsupported version "${raw.version}" (expected ${SCHEMA_VERSION}).`);
  const cfg = {
    version: SCHEMA_VERSION,
    template: typeof raw.template === 'string' ? raw.template : 'telemetry-ingest',
    nodes: Array.isArray(raw.nodes) ? raw.nodes.filter(n => n && typeof n.id === 'string') : [],
    edges: Array.isArray(raw.edges) ? raw.edges.filter(e => e && e.from && e.to) : [],
    pathOverrides: (raw.pathOverrides && typeof raw.pathOverrides === 'object') ? raw.pathOverrides : {},
    theme: (raw.theme === 'dark' || raw.theme === 'light') ? raw.theme : null,
    blockStates: (raw.blockStates && typeof raw.blockStates === 'object') ? raw.blockStates : null,
  };
  // Validate telemetry entity references where present
  Object.keys(cfg.pathOverrides).forEach(sid => {
    const s = REG.source(sid);
    if (!s) { errors.push(`pathOverrides references unknown source "${sid}".`); delete cfg.pathOverrides[sid]; return; }
    if (!s.paths.includes(cfg.pathOverrides[sid])) { errors.push(`Source "${sid}" does not support path "${cfg.pathOverrides[sid]}" — reverting to default.`); delete cfg.pathOverrides[sid]; }
  });
  return { ok: errors.length === 0, config: cfg, errors };
}

/* ═══════════════════════════════════════════════════════════════════════
   LAYER 2 — TEMPLATE CONTENT (alliance templates, unchanged content)
   ═══════════════════════════════════════════════════════════════════════ */
const COV = {
  NATIVE:   {fill:'rgba(0,191,207,0.12)',stroke:'#00BFCF',accent:'#00BFCF',text:'#0a7c86'},
  HYBRID:   {fill:'rgba(255,139,0,0.12)',stroke:'#FF8B00',accent:'#FF8B00',text:'#b3651a'},
  PARTNER:  {fill:'rgba(124,58,237,0.10)',stroke:'#7C3AED',accent:'#7C3AED',text:'#5a3fcc'},
  SERVICES: {fill:'rgba(255,45,120,0.10)',stroke:'#FF2D78',accent:'#FF2D78',text:'#c42858'},
};
const GHOST = {fill:'none',stroke:'#9aa4b2',accent:'#9aa4b2',text:'#9aa4b2'};
const DISCLAIMER = 'This is a visual reference tool for mapping architecture domains. It does not constitute a recommendation, endorsement, or assurance of architectural validity. Validate all designs with qualified professionals.';
const CONN_TYPES = {
  ops:      {stroke:'#00BFCF',width:1.5,dash:'none'},
  response: {stroke:'#FF2D78',width:1.3,dash:'5 3'},
  data:     {stroke:'#7C3AED',width:1,  dash:'3 2'},
};
const BH = 36, BGAP = 4, ZPAD = 6, ZHDR = 20;
const INK = '#172B4D', MUTED = '#6B778C', FAINT = '#9aa4b2';

const TEMPLATES = [
// ─── TELEMETRY INGEST (flagship) ───
{
  id:'telemetry-ingest', name:'Telemetry Ingest', telemetry:true,
  desc:'How telemetry reaches NG-SIEM. Each source shows its collection path; sensor-native sources route direct, everything else funnels through Onum or a connector. Toggle sources, click a path pill to change it, or switch to Volume view.',
  sources: SOURCES.map(s => ({ id:s.id, on:['endpoints','identity','cloud-work','m365','cloudtrail','firewall'].includes(s.id) })),
  destinations:['ngsiem'],
},
// ─── FALCON CORE STACK ───
{
  id:'falcon-core', name:'Falcon Core Stack',
  desc:'Foundational CrowdStrike deployment — endpoint, cloud, identity, and data protection with unified security operations.',
  canvas:{w:1440,h:490},
  zones:[
    {id:'identity',label:'Identity Security',x:20,y:15,w:930,h:68,color:'rgba(0,191,207,0.08)',bc:'#00BFCF',overlay:true,dir:'h'},
    {id:'endpoints',label:'Endpoints',x:20,y:93,w:300,h:230,color:'rgba(0,191,207,0.06)',bc:'#00BFCF'},
    {id:'cloud',label:'Cloud & SaaS',x:330,y:93,w:300,h:230,color:'rgba(124,58,237,0.06)',bc:'#7C3AED'},
    {id:'data',label:'Data',x:640,y:93,w:300,h:230,color:'rgba(255,45,120,0.06)',bc:'#FF2D78'},
    {id:'secops',label:'Security Operations',x:20,y:333,w:930,h:68,color:'rgba(23,43,77,0.05)',bc:'#0D1F3C',overlay:true,dir:'h'},
    {id:'siem-bar',label:'NG-SIEM',x:20,y:411,w:930,h:48,color:'rgba(23,43,77,0.06)',bc:'#0D1F3C',isSiemBar:true},
    {id:'services',label:'Services & Managed',x:960,y:15,w:460,h:444,color:'rgba(23,43,77,0.03)',bc:'#6B778C',isServices:true},
  ],
  blocks:[
    {id:'itdr',label:'Falcon Identity Protection',sub:'ITDR',zone:'identity',cov:'NATIVE',on:true},
    {id:'fid',label:'Falcon ID',sub:'MFA / Passwordless',zone:'identity',cov:'HYBRID',on:true},
    {id:'epp',label:'Falcon Prevent',sub:'EPP / NGAV',zone:'endpoints',cov:'NATIVE',on:true},
    {id:'edr',label:'Falcon Insight XDR',sub:'EDR / XDR',zone:'endpoints',cov:'NATIVE',on:true},
    {id:'fw',label:'Falcon Firewall Mgmt',sub:'Host Firewall',zone:'endpoints',cov:'NATIVE',on:true},
    {id:'devctl',label:'Falcon Device Control',sub:'USB / Peripheral',zone:'endpoints',cov:'NATIVE',on:false},
    {id:'mobile',label:'Falcon for Mobile',sub:'MTD',zone:'endpoints',cov:'NATIVE',on:false},
    {id:'cnapp',label:'Falcon Cloud Security',sub:'CNAPP',zone:'cloud',cov:'NATIVE',on:true},
    {id:'shield',label:'Falcon Shield',sub:'SSPM',zone:'cloud',cov:'NATIVE',on:true},
    {id:'cdr',label:'Cloud Detection & Response',sub:'CDR',zone:'cloud',cov:'NATIVE',on:true},
    {id:'dlp',label:'Falcon Data Security',sub:'DLP',zone:'data',cov:'NATIVE',on:true},
    {id:'dspm',label:'Data Security Posture',sub:'DSPM',zone:'data',cov:'NATIVE',on:true},
    {id:'dc',label:'AI Data Classification',sub:'Classification',zone:'data',cov:'NATIVE',on:false},
    {id:'soar',label:'Falcon Fusion SOAR',sub:'Automation',zone:'secops',cov:'NATIVE',on:true},

  else (t.blocks||[]).forEach(b => { blockStates[t.id][b.id] = b.on; });

const NS = 'http://www.w3.org/2000/svg';
function el(tag,a={}){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e;}

/* ── Theme ── */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme==='dark' ? 'dark' : 'light');
  document.getElementById('themeLabel').textContent = theme==='dark' ? 'Light' : 'Dark';
  try{ localStorage.setItem('tih-db-theme', theme); }catch(e){}
}
function currentTheme(){ return document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light'; }
function initTheme(){
  let t=null; try{ t=localStorage.getItem('tih-db-theme'); }catch(e){}
  if(!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t='dark';
  applyTheme(t==='dark' ? 'dark' : 'light');
}
document.getElementById('themeToggle').addEventListener('click',()=>{ applyTheme(currentTheme()==='dark'?'light':'dark'); });

/* ── Connection routing (alliance templates) ── */
function routeConnection(fromId,toId,bp,template){
  const fp=bp[fromId],tp=bp[toId];
  if(!fp||!tp)return'';
  const fb=template.blocks.find(b=>b.id===fromId),tb=template.blocks.find(b=>b.id===toId);
  if(!fb||!tb)return'';
  const fz=template.zones.find(z=>z.id===fb.zone),tz=template.zones.find(z=>z.id===tb.zone);
  if(!fz||!tz)return'';
  if(fz.id===tz.id){
    if(fz.dir==='h'){
      const x1=fp.x+fp.w+2,y1=fp.y+fp.h/2,x2=tp.x-2,y2=tp.y+tp.h/2;
      if(Math.abs(y1-y2)<4)return`M${x1},${y1} L${x2},${y2}`;
      const mx=(x1+x2)/2;
      return`M${x1},${y1} L${mx},${y1} L${mx},${y2} L${x2},${y2}`;
    }
    const x=fp.x+fp.w/2;
    return`M${x},${fp.y+fp.h+2} L${x},${tp.y-2}`;
  }
  const fpCx=fp.x+fp.w/2,tpCx=tp.x+tp.w/2;
  const hOv=Math.min(fz.x+fz.w,tz.x+tz.w)-Math.max(fz.x,tz.x);
  const vOv=Math.min(fz.y+fz.h,tz.y+tz.h)-Math.max(fz.y,tz.y);
  const vGd=tz.y-(fz.y+fz.h),vGu=fz.y-(tz.y+tz.h);
  const hGr=tz.x-(fz.x+fz.w),hGl=fz.x-(tz.x+tz.w);
  if(hOv>30&&vGd>=0&&vGd<25){
    const ex=fpCx,ey=fp.y+fp.h+2,nx=tpCx,ny=tp.y-2,gy=fz.y+fz.h+vGd/2;
    if(Math.abs(ex-nx)<8)return`M${ex},${ey} L${ex},${ny}`;
    return`M${ex},${ey} L${ex},${gy} L${nx},${gy} L${nx},${ny}`;
  }
  if(hOv>30&&vGu>=0&&vGu<25){
    const ex=fpCx,ey=fp.y-2,nx=tpCx,ny=tp.y+tp.h+2,gy=tz.y+tz.h+vGu/2;
    if(Math.abs(ex-nx)<8)return`M${ex},${ey} L${ex},${ny}`;
    return`M${ex},${ey} L${ex},${gy} L${nx},${gy} L${nx},${ny}`;
  }
  if(vOv>30&&hGr>=0&&hGr<25){
    const ex=fp.x+fp.w+2,ey=fp.y+fp.h/2,nx=tp.x-2,ny=tp.y+tp.h/2,gx=fz.x+fz.w+hGr/2;
    if(Math.abs(ey-ny)<5)return`M${ex},${ey} L${nx},${ny}`;
    return`M${ex},${ey} L${gx},${ey} L${gx},${ny} L${nx},${ny}`;
  }
  if(vOv>30&&hGl>=0&&hGl<25){
    const ex=fp.x-2,ey=fp.y+fp.h/2,nx=tp.x+tp.w+2,ny=tp.y+tp.h/2,gx=tz.x+tz.w+hGl/2;
    if(Math.abs(ey-ny)<5)return`M${ex},${ey} L${nx},${ny}`;
    return`M${ex},${ey} L${gx},${ey} L${gx},${ny} L${nx},${ny}`;
  }
  const goD=tp.y>fp.y;
  if(goD){
    const ex=fpCx,ey=fp.y+fp.h+2,nx=tpCx,ny=tp.y-2,wy=fz.y+fz.h+4;
    if(Math.abs(ex-nx)<8)return`M${ex},${ey} L${ex},${ny}`;
    return`M${ex},${ey} L${ex},${wy} L${nx},${wy} L${nx},${ny}`;
  }else{
    const ex=fpCx,ey=fp.y-2,nx=tpCx,ny=tp.y+tp.h+2,wy=fz.y-4;
    if(Math.abs(ex-nx)<8)return`M${ex},${ey} L${ex},${ny}`;
    return`M${ex},${ey} L${ex},${wy} L${nx},${wy} L${nx},${ny}`;
  }
}

/* ── RENDER dispatch ── */
function render(){
  if (isTelemetry()) renderTelemetry();
  else renderAlliance();
  setupHover();
}

/* ── RENDER: alliance templates (re-tokened) ── */
function renderAlliance(){
  const t=tpl(),st=blockStates[t.id];
  const svg=document.getElementById('diagramSvg');
  svg.innerHTML='';
  svg.setAttribute('width',t.canvas.w);svg.setAttribute('height',t.canvas.h);
  svg.setAttribute('viewBox',`0 0 ${t.canvas.w} ${t.canvas.h}`);
  svg.appendChild(Object.assign(el('style'),{textContent:'[data-block],[data-conn]{transition:opacity 0.15s ease}'}));
  const defs=el('defs');
  const bsf=el('filter',{id:'bs',x:'-3%',y:'-3%',width:'106%',height:'110%'});
  bsf.appendChild(el('feDropShadow',{dx:'0',dy:'1',stdDeviation:'1.2','flood-color':'rgba(13,31,60,0.06)'}));
  defs.appendChild(bsf);
  Object.entries(CONN_TYPES).forEach(([k,ct])=>{
    const m=el('marker',{id:`ah-${k}`,viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'5',markerHeight:'5',orient:'auto'});
    m.appendChild(el('path',{d:'M0 1.5 L10 5 L0 8.5 z',fill:ct.stroke}));
    defs.appendChild(m);
  });
  svg.appendChild(defs);
  svg.appendChild(el('rect',{x:0,y:0,width:t.canvas.w,height:t.canvas.h,fill:'#ffffff',rx:8}));
  svg.appendChild(txt('thinkinfosec.org',t.canvas.w-14,t.canvas.h-8,{'text-anchor':'end','font-family':'Space Mono,monospace','font-size':'7',fill:'#c3ccd6','letter-spacing':'0.04em'}));
  svg.appendChild(txt(t.name,t.canvas.w-14,t.canvas.h-18,{'text-anchor':'end','font-family':'Space Mono,monospace','font-size':'8','font-weight':'700',fill:'#c3ccd6'}));
  svg.appendChild(txt('Visual reference only — not a recommendation or assurance of architectural validity.',20,t.canvas.h-8,{'font-family':'Inter,sans-serif','font-size':'6.5',fill:'#b6bfca'}));

  t.zones.forEach(z=>{
    const g=el('g',{'data-zone':z.id});
    const fc=z.isServices?'rgba(23,43,77,0.03)':z.isSiemBar?'rgba(23,43,77,0.06)':z.color;
    g.appendChild(el('rect',{x:z.x,y:z.y,width:z.w,height:z.h,rx:6,fill:fc,stroke:z.bc,
      'stroke-width':z.isSiemBar?1.5:z.overlay?1:0.7,
      'stroke-dasharray':z.overlay?'5 3':z.isServices?'3 2':'none'}));
    if(z.isServices)g.appendChild(txt('⚙',z.x+z.w-16,z.y+13,{'font-size':'9',fill:'#6B778C'}));
    if(!z.isSiemBar)g.appendChild(txt(z.label.toUpperCase(),z.x+8,z.y+13,{
      'font-family':'Space Mono,monospace','font-size':'8','font-weight':'700',fill:z.bc,'letter-spacing':'0.05em',opacity:'0.85'}));
    svg.appendChild(g);
  });

  const blockPos={};
  t.zones.forEach(z=>{
    const ab=t.blocks.filter(b=>b.zone===z.id);
    if(!ab.length)return;
    if(z.isSiemBar){ab.forEach(b=>{blockPos[b.id]={x:z.x+ZPAD,y:z.y+6,w:z.w-ZPAD*2,h:z.h-12};});return;}
    const isH=z.dir==='h';
    if(isH){
      const bH=BH,avW=z.w-ZPAD*2,bW=Math.min(180,(avW-(ab.length-1)*BGAP)/ab.length);
      const totW=ab.length*bW+(ab.length-1)*BGAP;
      let cx=z.x+(z.w-totW)/2;const cy=z.y+ZHDR+ZPAD;
      ab.forEach((b,i)=>{blockPos[b.id]={x:cx+i*(bW+BGAP),y:cy,w:bW,h:bH};});
    }else{
      const bW=z.w-ZPAD*2;let cy=z.y+ZHDR+ZPAD;
      ab.forEach(b=>{blockPos[b.id]={x:z.x+ZPAD,y:cy,w:bW,h:BH};cy+=BH+BGAP;});
    }
  });

  const mz=t.zones.filter(z=>!z.overlay&&!z.isServices&&!z.isSiemBar);
  for(let i=0;i<mz.length-1;i++){
    const a=mz[i],b=mz[i+1];
    if(Math.abs(a.y-b.y)<20){
      const ax=a.x+a.w+1,ay=a.y+a.h/2;
      svg.appendChild(el('path',{d:`M${ax+2},${ay-5} L${ax+7},${ay} L${ax+2},${ay+5}`,fill:'none',stroke:'#c3ccd6','stroke-width':'1.2','stroke-linecap':'round'}));
    }
  }

  const connLayer=el('g',{opacity:'0.65'});
  t.connections.forEach(conn=>{
    if(!st[conn.from]||!st[conn.to])return;
    if(!blockPos[conn.from]||!blockPos[conn.to])return;
    const type=conn.type||'ops',ct=CONN_TYPES[type];
    const path=routeConnection(conn.from,conn.to,blockPos,t);
    if(!path)return;
    connLayer.appendChild(el('path',{d:path,fill:'none',stroke:ct.stroke,'stroke-width':ct.width,
      'stroke-dasharray':ct.dash,'marker-end':`url(#ah-${type})`,'data-conn':`${conn.from}→${conn.to}`,'data-type':type}));
  });
  svg.appendChild(connLayer);

  t.blocks.forEach(b=>{
    const pos=blockPos[b.id];if(!pos)return;
    const isA=st[b.id],c=isA?(COV[b.cov]||COV.NATIVE):GHOST;
    const isSB=t.zones.find(z=>z.id===b.zone)?.isSiemBar;
    const g=el('g',{'data-block':b.id});
    if(isA)g.setAttribute('filter','url(#bs)');
    g.style.cursor='pointer';
    g.appendChild(el('rect',{x:pos.x,y:pos.y,width:pos.w,height:pos.h,rx:isSB?6:5,
      fill:isA?'#fff':'none',stroke:c.stroke,'stroke-width':isA?(isSB?1.4:0.8):0.7,
      'stroke-dasharray':isA?'none':'4 3',opacity:isA?1:0.55}));
    g.appendChild(el('rect',{x:pos.x,y:pos.y,width:isSB?4:3,height:pos.h,rx:1.5,fill:c.accent,opacity:isA?1:0.35}));
    const maxC=Math.floor(pos.w/5.8);let label=b.label;
    if(label.length>maxC)label=label.substring(0,maxC-1)+'…';
    g.appendChild(txt(label,pos.x+(isSB?12:9),pos.y+(isSB?16:14),{
      'font-family':'Inter,sans-serif','font-size':isSB?'10':'8.5','font-weight':isA?(isSB?'700':'600'):'400',fill:isA?'#172B4D':'#9aa4b2'}));
    if(b.sub){
      const subMax=Math.floor(pos.w/4.2);let sub=b.sub;
      if(sub.length>subMax)sub=sub.substring(0,subMax-1)+'…';
      g.appendChild(txt(sub,pos.x+(isSB?12:9),pos.y+(isSB?28:25),{
        'font-family':'Space Mono,monospace','font-size':isSB?'7':'6.5',fill:isA?c.text:'#cbd5e1','letter-spacing':'0.01em'}));
    }
    if(isA){
      g.appendChild(el('circle',{cx:pos.x+pos.w-10,cy:pos.y+10,r:3.5,fill:c.accent,opacity:'0.85'}));
    }else{
      g.appendChild(txt('GAP',pos.x+pos.w-20,pos.y+12,{'font-family':'Space Mono,monospace','font-size':'5.5','font-weight':'700',fill:'#c3ccd6'}));
    }
    svg.appendChild(g);
  });

  const sb=t.zones.find(z=>z.isSiemBar);
  if(sb){
    const ay=sb.y-3,techW=sb.w;
    const pts=[0.12,0.28,0.44,0.6,0.76,0.92];
    pts.forEach(p=>{
      const ax=sb.x+techW*p;
      svg.appendChild(el('path',{d:`M${ax-3},${ay-4} L${ax},${ay} L${ax+3},${ay-4}`,fill:'none',stroke:'#c9d2dc','stroke-width':'0.8','stroke-linecap':'round'}));
    });
    svg.appendChild(txt('▼ TELEMETRY INGESTION',sb.x+techW/2,ay-7,{
      'text-anchor':'middle','font-family':'Space Mono,monospace','font-size':'5.5','font-weight':'700',fill:'#b6bfca','letter-spacing':'0.1em'}));
  }
}

/* ── RENDER: telemetry template ── */
const VOL_H = { low:4, med:9, high:16 };
function telemetrySources(){ return tpl().sources.map(s => REG.source(s.id)).filter(Boolean); }
function activeSources(){ const st=blockStates[tpl().id]; return telemetrySources().filter(s => st[s.id]); }

function renderTelemetry(){
  const t=tpl(), st=blockStates[t.id];
  const svg=document.getElementById('diagramSvg');
  const srcs=telemetrySources();
  const on=srcs.filter(s=>st[s.id]);
  // Layout metrics
  const W=1440, pad=20, laneLabW=92, laneX=pad+laneLabW, laneW=W-laneX-pad;
  const insetX=12;                    // horizontal padding inside each lane (left & right)
  const innerW=laneW-insetX*2;        // usable width for chips inside a lane
  const chipH=34, chipGap=6;
  // Sources: pick a column count that fits, then derive chip width from innerW.
  const perRow=Math.max(1,Math.min(on.length,Math.floor((innerW+chipGap)/(140+chipGap))));
  const srcRows=Math.max(1,Math.ceil(on.length/perRow));
  const srcH=Math.max(64, 22 + srcRows*chipH + (srcRows-1)*chipGap + 10);
  const pathH=54, pipeH=64, destH=54;
  // Outcomes: compute rows from the same innerW so we can size the lane to fit.
  const oChipH=28, oGap=6, oMinW=150;
  const oPerRow=Math.max(1,Math.floor((innerW+oGap)/(oMinW+oGap)));
  const onOutcomeCount=[...new Set(on.flatMap(s=>s.outcomes))].length;
  const oRows=Math.max(1,Math.ceil(onOutcomeCount/oPerRow));
  const outH=Math.max(56, 22 + oRows*oChipH + (oRows-1)*oGap + 10);
  const laneGap=34; // room for arrows
  const H = pad*2 + srcH + pathH + pipeH + destH + outH + laneGap*4;
  svg.innerHTML='';
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.appendChild(Object.assign(el('style'),{textContent:'[data-src]{transition:opacity .15s ease;cursor:pointer}'}));
  const defs=el('defs');
  const mk=(id,color)=>{const m=el('marker',{id,viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'6',markerHeight:'6',orient:'auto'});m.appendChild(el('path',{d:'M0 1.5 L10 5 L0 8.5 z',fill:color}));defs.appendChild(m);};
  mk('ah-acc','#00BFCF'); mk('ah-navy','#0D1F3C'); mk('ah-mut','#9aa4b2');
  svg.appendChild(defs);
  svg.appendChild(el('rect',{x:0,y:0,width:W,height:H,fill:'#ffffff',rx:8}));
  svg.appendChild(txt('thinkinfosec.org',W-14,H-10,{'text-anchor':'end','font-family':'Space Mono,monospace','font-size':'7',fill:'#c3ccd6','letter-spacing':'0.04em'}));
  svg.appendChild(txt('Telemetry ingestion — collection path per source',20,H-10,{'font-family':'Inter,sans-serif','font-size':'6.5',fill:'#b6bfca'}));

  // Lane Y positions
  let y=pad;
  const ySrc=y; y+=srcH+laneGap;
  const yPath=y; y+=pathH+laneGap;
  const yPipe=y; y+=pipeH+laneGap;
  const yDest=y; y+=destH+laneGap;
  const yOut=y;

  const lane=(ly,lh,label,accent,fill)=>{
    svg.appendChild(el('rect',{x:laneX,y:ly,width:laneW,height:lh,rx:8,fill:fill,stroke:'#DFE1E6','stroke-width':0.8,'stroke-dasharray':'none'}));
    const lx=pad+10, lcy=ly+lh/2;
    svg.appendChild(txt(label.toUpperCase(),lx,lcy,{'font-family':'Space Mono,monospace','font-size':'8','font-weight':'700',fill:accent,'letter-spacing':'0.08em','text-anchor':'start'}));
  };

  // ── SOURCES lane ──
  lane(ySrc,srcH,'Sources','#0D1F3C','#FAFBFC');
  const pos={};
  const cw=(innerW-(perRow-1)*chipGap)/perRow;
  on.forEach((s,i)=>{
    const col=i%perRow,row=Math.floor(i/perRow);
    const x=laneX+insetX+col*(cw+chipGap), cy=ySrc+22+row*(chipH+chipGap);
    pos[s.id]={x,y:cy,w:cw,h:chipH};
  });
  // ── PATH lane ──
  lane(yPath,pathH,'Collection','#00BFCF','rgba(0,191,207,0.05)');
  // path nodes: distinct active paths in play
  const activePathIds=[...new Set(on.map(s=>resolveActivePath(s.id,pathOverrides)))];
  const directPaths=activePathIds.filter(p=>PATHS[p].via==='direct');
  const onumNeeded=activePathIds.some(p=>PATHS[p].via==='onum');
  const pathPos={};
  const pathNodeW=150, pathNodeH=30;
  const nPathNodes=activePathIds.length;
  // Fit within innerW: shrink node width if needed, then distribute evenly.
  const pw=Math.min(pathNodeW,(innerW-(nPathNodes-1)*12)/nPathNodes);
  const pathSpan=nPathNodes*pw+(nPathNodes-1)*12;
  const pathX0=laneX+insetX+Math.max(0,(innerW-pathSpan)/2);
  activePathIds.forEach((p,i)=>{
    const x=pathX0+i*(pw+12);
    pathPos[p]={x,y:yPath+12,w:pw,h:pathNodeH};
  });
  // ── PIPELINE lane ──
  lane(yPipe,pipeH,'Pipeline','#00BFCF','rgba(0,191,207,0.05)');
  const onumPos={x:laneX+laneW/2-190,y:yPipe+16,w:380,h:32};
  // ── DESTINATION lane ──
  lane(yDest,destH,'Destination','#0D1F3C','rgba(23,43,77,0.04)');
  const destPos={x:laneX+laneW/2-190,y:yDest+11,w:380,h:32};
  // ── OUTCOMES lane ──
  lane(yOut,outH,'Outcomes','#0D1F3C','#FAFBFC');

  // ── CONNECTIONS ──
  const connG=el('g',{opacity:'0.8'});
  const volScale={low:2,med:4,high:7};
  on.forEach(s=>{
    if(!pos[s.id])return;
    const p=resolveActivePath(s.id,pathOverrides), pv=PATHS[p].via;
    const sx=pos[s.id].x+pos[s.id].w/2, sy=pos[s.id].y+pos[s.id].h;
    const sw=volScale[s.volume]||3;
    if(volumeView){
      // Sankey-style band straight to destination, width = volume
      const tx=destPos.x+destPos.w/2, ty=destPos.y;
      const midY=(sy+ty)/2;
      connG.appendChild(el('path',{d:`M${sx},${sy} C${sx},${midY} ${tx},${midY} ${tx},${ty}`,fill:'none',
        stroke:'#00BFCF','stroke-width':sw*2,opacity:'0.28','data-src-conn':s.id,stroke_linecap:'round'}));
    } else if(pv==='direct'){
      const pp=pathPos[p]; if(!pp)return;
      const px=pp.x+pp.w/2, py=pp.y;
      connG.appendChild(el('path',{d:`M${sx},${sy} L${sx},${py-6} L${px},${py-6} L${px},${py}`,fill:'none',stroke:'#0D1F3C','stroke-width':1.2,'data-src-conn':s.id}));
    } else {
      const pp=pathPos[p]; if(!pp)return;
      const px=pp.x+pp.w/2, py=pp.y;
      connG.appendChild(el('path',{d:`M${sx},${sy} L${sx},${py-6} L${px},${py-6} L${px},${py}`,fill:'none',stroke:'#00BFCF','stroke-width':1.2,'data-src-conn':s.id}));
    }
  });
  if(!volumeView){
    // path → pipeline/destination
    activePathIds.forEach(p=>{
      const pp=pathPos[p]; if(!pp)return;
      const px=pp.x+pp.w/2, py=pp.y+pp.h;
      if(PATHS[p].via==='onum'){
        const ox=onumPos.x+onumPos.w/2, oy=onumPos.y;
        connG.appendChild(el('path',{d:`M${px},${py} L${px},${oy-8} L${ox},${oy-8} L${ox},${oy}`,fill:'none',stroke:'#00BFCF','stroke-width':1.4,'marker-end':'url(#ah-acc)'}));
      } else {
        const dx=destPos.x+destPos.w/2, dy=destPos.y;
        connG.appendChild(el('path',{d:`M${px},${py} L${px},${dy-8} L${dx},${dy-8} L${dx},${dy}`,fill:'none',stroke:'#0D1F3C','stroke-width':1.4,'marker-end':'url(#ah-navy)'}));
      }
    });
    // onum → destination
    if(onumNeeded){
      const ox=onumPos.x+onumPos.w/2, oy=onumPos.y+onumPos.h;
      const dx=destPos.x+destPos.w/2, dy=destPos.y;
      connG.appendChild(el('path',{d:`M${ox},${oy} L${ox},${dy-6} L${dx},${dy-6} L${dx},${dy}`,fill:'none',stroke:'#00BFCF','stroke-width':1.6,'marker-end':'url(#ah-acc)'}));
    }
  }
  // destination → outcomes
  const onOutcomeIds=[...new Set(on.flatMap(s=>s.outcomes))];
  const outPos={};
  const oChipW=(innerW-(oPerRow-1)*oGap)/oPerRow;
  onOutcomeIds.forEach((oid,i)=>{
    const col=i%oPerRow,row=Math.floor(i/oPerRow);
    const x=laneX+insetX+col*(oChipW+oGap), cy=yOut+22+row*(oChipH+oGap);
    outPos[oid]={x,y:cy,w:oChipW,h:oChipH};
  });
  const dx=destPos.x+destPos.w/2, ddy=destPos.y+destPos.h;
  onOutcomeIds.forEach(oid=>{
    if(!outPos[oid])return;
    const ox=outPos[oid].x+outPos[oid].w/2, oy=outPos[oid].y;
    connG.appendChild(el('path',{d:`M${dx},${ddy} L${dx},${oy-6} L${ox},${oy-6} L${ox},${oy}`,fill:'none',stroke:'#9aa4b2','stroke-width':0.9,'stroke-dasharray':'3 3'}));
  });
  svg.appendChild(connG);

  // ── SOURCE chips (with path pill) ──
  on.forEach(s=>{
    const p=pos[s.id]; if(!p)return;
    const ap=resolveActivePath(s.id,pathOverrides), path=PATHS[ap];
    const multi=s.paths.length>1;
    const g=el('g',{'data-src':s.id,'data-kind':'source'});
    g.appendChild(el('rect',{x:p.x,y:p.y,width:p.w,height:p.h,rx:6,fill:'#fff',stroke:'#00BFCF','stroke-width':1.2}));
    g.appendChild(el('rect',{x:p.x,y:p.y,width:3,height:p.h,rx:1.5,fill:'#00BFCF'}));
    const maxC=Math.floor(p.w/6.2);let lbl=s.label; if(lbl.length>maxC)lbl=lbl.substring(0,maxC-1)+'…';
    g.appendChild(txt(lbl,p.x+9,p.y+14,{'font-family':'Inter,sans-serif','font-size':'9','font-weight':'600',fill:'#172B4D'}));
    // path pill
    const pillW=Math.min(p.w-16, 8+path.label.length*4.6), pillX=p.x+8, pillY=p.y+19;
    const pg=el('g',{'data-pathpill':s.id, style:'cursor:'+(multi?'pointer':'default')});
    pg.appendChild(el('rect',{x:pillX,y:pillY,width:pillW,height:11,rx:2,
      fill: ap==='sensor-native'?'#0D1F3C':(ap==='falcon-shield'?'rgba(0,191,207,0.15)':'rgba(23,43,77,0.08)'),
      stroke: ap==='sensor-native'?'#0D1F3C':(ap==='falcon-shield'?'#00BFCF':'#9aa4b2'),'stroke-width':0.7,
      'stroke-dasharray': ap==='syslog'?'2 2':'none'}));
    pg.appendChild(txt(path.label+(multi?' ▸':''),pillX+pillW/2,pillY+8,{'text-anchor':'middle','font-family':'Space Mono,monospace','font-size':'6','letter-spacing':'0.04em','font-weight':'700',
      fill: ap==='sensor-native'?'#00BFCF':'#172B4D'}));
    g.appendChild(pg);
    svg.appendChild(g);
  });

  // ── PATH nodes ──
  if(!volumeView){
    activePathIds.forEach(p=>{
      const pp=pathPos[p]; if(!pp)return;
      const path=PATHS[p];
      const g=el('g',{'data-src':p,'data-kind':'pathnode'});
      g.appendChild(el('rect',{x:pp.x,y:pp.y,width:pp.w,height:pp.h,rx:6,fill:'#fff',stroke:'#00BFCF','stroke-width':1.3}));
      g.appendChild(txt(path.label,pp.x+pp.w/2,pp.y+13,{'text-anchor':'middle','font-family':'Inter,sans-serif','font-size':'9.5','font-weight':'600',fill:'#0D1F3C'}));
      g.appendChild(txt(path.via==='direct'?'direct to NG-SIEM':'via Onum',pp.x+pp.w/2,pp.y+23,{'text-anchor':'middle','font-family':'Space Mono,monospace','font-size':'6',fill:'#6B778C'}));
      svg.appendChild(g);
    });
  }

  // ── PIPELINE (Onum) ──
  if(!volumeView && onumNeeded){
    const g=el('g',{'data-src':'onum','data-kind':'pipeline'});
    g.appendChild(el('rect',{x:onumPos.x,y:onumPos.y,width:onumPos.w,height:onumPos.h,rx:6,fill:'#fff',stroke:'#00BFCF','stroke-width':1.4}));
    g.appendChild(txt('Falcon Onum',onumPos.x+12,onumPos.y+14,{'font-family':'Inter,sans-serif','font-size':'10','font-weight':'700',fill:'#0D1F3C'}));
    const stages=PIPELINES[0].stages;
    g.appendChild(txt(stages.join(' → '),onumPos.x+12,onumPos.y+25,{'font-family':'Space Mono,monospace','font-size':'6.5',fill:'#6B778C'}));
    svg.appendChild(g);
  }

  // ── DESTINATION ──
  {
    const g=el('g',{'data-src':'ngsiem','data-kind':'destination'});
    g.appendChild(el('rect',{x:destPos.x,y:destPos.y,width:destPos.w,height:destPos.h,rx:6,fill:'#0D1F3C',stroke:'#0D1F3C','stroke-width':1.4}));
    g.appendChild(txt('NG-SIEM (LogScale)',destPos.x+destPos.w/2,destPos.y+15,{'text-anchor':'middle','font-family':'Inter,sans-serif','font-size':'10.5','font-weight':'700',fill:'#00BFCF'}));
    g.appendChild(txt(volumeView?'ingest volume ∝ band width':'unified data platform',destPos.x+destPos.w/2,destPos.y+25,{'text-anchor':'middle','font-family':'Space Mono,monospace','font-size':'6.5',fill:'#9fb2c8'}));
    svg.appendChild(g);
  }

  // ── OUTCOME chips ──
  onOutcomeIds.forEach(oid=>{
    const o=REG.outcome(oid), p=outPos[oid]; if(!o||!p)return;
    const g=el('g',{'data-src':oid,'data-kind':'outcome'});
    g.appendChild(el('rect',{x:p.x,y:p.y,width:p.w,height:p.h,rx:6,fill:'rgba(0,191,207,0.08)',stroke:'#00BFCF','stroke-width':0.9}));
    const maxC=Math.floor(p.w/5.6);let lbl=o.label; if(lbl.length>maxC)lbl=lbl.substring(0,maxC-1)+'…';
    g.appendChild(txt(lbl,p.x+p.w/2,p.y+p.h/2+3,{'text-anchor':'middle','font-family':'Inter,sans-serif','font-size':'8.5','font-weight':'600',fill:'#0D1F3C'}));
    svg.appendChild(g);
  });
}

/* ── Path pill click (cycle supported paths) ── */
document.getElementById('diagramSvg').addEventListener('click', e=>{
  const pill=e.target.closest('[data-pathpill]');
  if(pill){
    e.stopPropagation();
    const sid=pill.dataset.pathpill, s=REG.source(sid); if(!s||s.paths.length<2)return;
    const cur=resolveActivePath(sid,pathOverrides);
    const idx=s.paths.indexOf(cur);
    const next=s.paths[(idx+1)%s.paths.length];
    pathOverrides[sid]=next;
    pinnedBlock=null;
    renderTelemetry();
    return;
  }
});

/* ── Hover & tooltip ── */
function setupHover(){
  const svg=document.getElementById('diagramSvg');
  if(isTelemetry()){
    svg.querySelectorAll('[data-src]').forEach(g=>{
      g.addEventListener('mouseenter',e=>onTelemetryHover(g.dataset.src,e));
      g.addEventListener('mouseleave',()=>{clearHL();});
    });
    return;
  }
  svg.querySelectorAll('[data-block]').forEach(g=>{
    g.addEventListener('mouseenter',e=>onHover(g.dataset.block,e));
    g.addEventListener('mouseleave',()=>{if(!pinnedBlock)clearHL();});
    g.addEventListener('click',e=>{
      e.stopPropagation();
      if(pinnedBlock===g.dataset.block){pinnedBlock=null;clearHL();}
      else{pinnedBlock=g.dataset.block;onHover(g.dataset.block,e);}
    });
  });
  svg.addEventListener('click',()=>{if(pinnedBlock){pinnedBlock=null;clearHL();}});
}
function onTelemetryHover(id,ev){
  const svg=document.getElementById('diagramSvg');
  const s=REG.source(id);
  // build related set: for a source → its route + outcomes; for an outcome → contributing sources
  const rel=new Set([id]);
  if(s){
    rel.add(resolveActivePath(id,pathOverrides));
    if(PATHS[resolveActivePath(id,pathOverrides)].via==='onum')rel.add('onum');
    rel.add('ngsiem');
    s.outcomes.forEach(o=>rel.add(o));
  } else if(REG.outcome(id)){
    rel.add('ngsiem');
    REG.outcome(id).sources.forEach(sid=>{ if(blockStates[tpl().id][sid]){ rel.add(sid); rel.add(resolveActivePath(sid,pathOverrides)); } });
  } else { rel.add('ngsiem'); }
  svg.querySelectorAll('[data-src]').forEach(g=>{ g.style.opacity=rel.has(g.dataset.src)?'1':'0.15'; });
  svg.querySelectorAll('[data-src-conn]').forEach(p=>{ p.style.opacity=(s&&p.dataset.srcConn===id)?'0.6':'0.08'; });
  showTelemetryTip(id,ev);
}
function showTelemetryTip(id,ev){
  const tip=document.getElementById('tooltip');
  const s=REG.source(id), o=REG.outcome(id);
  let html='';
  if(s){
    const ap=resolveActivePath(id,pathOverrides), path=PATHS[ap];
    html=`<div class="tip-name">${s.label}</div><div class="tip-sub">${s.category} · volume: ${s.volume}</div>`
      +`<span class="tip-badge" style="background:rgba(0,191,207,0.2);color:#00BFCF">${path.label}</span>`
      +`<div class="tip-row"><b>OCSF:</b> ${s.ocsfClasses.join(', ')}</div>`
      +`<div class="tip-row"><b>Enables:</b> ${s.outcomes.map(x=>REG.outcome(x)?.label||x).join('; ')}</div>`
      +(s.paths.length>1?`<div class="tip-row" style="color:#9fb2c8">Click the pill to change path (${s.paths.map(p=>PATHS[p].label).join(' / ')})</div>`:'');
  } else if(o){
    html=`<div class="tip-name">${o.label}</div><div class="tip-sub">outcome</div>`
      +`<div class="tip-row"><b>Fed by:</b> ${o.sources.map(x=>REG.source(x)?.label||x).join('; ')}</div>`;
  } else {
    const path=PATHS[id];
    if(path) html=`<div class="tip-name">${path.label}</div><div class="tip-sub">collection path</div><div class="tip-row">${path.desc}</div>`;
    else if(id==='onum') html=`<div class="tip-name">Falcon Onum</div><div class="tip-sub">pipeline</div><div class="tip-row">${PIPELINES[0].stages.join(' → ')}</div>`;
    else if(id==='ngsiem') html=`<div class="tip-name">NG-SIEM (LogScale)</div><div class="tip-sub">destination</div><div class="tip-row">Unified data platform — all telemetry lands here.</div>`;
  }
  if(!html)return;
  tip.innerHTML=html; tip.style.display='block';
  const r=tip.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight;
  let lx=ev.clientX+14,ly=ev.clientY-10;
  if(lx+r.width>vw-10)lx=ev.clientX-r.width-10;
  if(ly+r.height>vh-10)ly=ev.clientY-r.height-10;
  tip.style.left=lx+'px';tip.style.top=ly+'px';
}
function onHover(bid,ev){
  const t=tpl(),st=blockStates[t.id],svg=document.getElementById('diagramSvg');
  const conn=new Set([bid]),cKeys=new Set();
  t.connections.forEach(c=>{
    if(!st[c.from]||!st[c.to])return;
    if(c.from===bid){conn.add(c.to);cKeys.add(`${c.from}→${c.to}`);}
    if(c.to===bid){conn.add(c.from);cKeys.add(`${c.from}→${c.to}`);}
  });
  svg.querySelectorAll('[data-block]').forEach(g=>{g.style.opacity=conn.has(g.dataset.block)?'1':'0.1';});
  svg.querySelectorAll('[data-conn]').forEach(p=>{
    const hl=cKeys.has(p.dataset.conn);
    p.style.opacity=hl?'1':'0.05';
    if(hl)p.setAttribute('stroke-width',String(CONN_TYPES[p.dataset.type||'ops'].width*1.8));
  });
  svg.querySelectorAll('[data-zone]').forEach(g=>{g.style.opacity='0.35';});
  showTip(bid,ev);
}
function clearHL(){
  const svg=document.getElementById('diagramSvg');
  svg.querySelectorAll('[data-block]').forEach(g=>{g.style.opacity='';});
  svg.querySelectorAll('[data-src]').forEach(g=>{g.style.opacity='';});

  });

}
function showTip(bid,ev){
  const b=tpl().blocks.find(bl=>bl.id===bid);if(!b)return;
  const c=COV[b.cov]||COV.NATIVE;
  const tip=document.getElementById('tooltip');
  tip.innerHTML=`<div class="tip-name">${b.label}</div><div class="tip-sub">${b.sub}</div><span class="tip-badge" style="background:${c.fill};color:${c.text}">${b.cov}</span>`;
  tip.style.display='block';
  const r=tip.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight;
  let lx=ev.clientX+14,ly=ev.clientY-10;
  if(lx+r.width>vw-10)lx=ev.clientX-r.width-10;
  if(ly+r.height>vh-10)ly=ev.clientY-r.height-10;
  tip.style.left=lx+'px';tip.style.top=ly+'px';
}

  });
  h+=`</div>`;
  h+=`<div class="sidebar-section"><div class="sidebar-section-title">Coverage</div>`;
  [['NATIVE','Native Module','#00BFCF'],['HYBRID','CS + Partner','#FF8B00'],['PARTNER','Partner-Led','#7C3AED'],['SERVICES','Managed Service','#FF2D78']].forEach(([k,l,c])=>{
    h+=`<div style="display:flex;align-items:center;gap:4px;margin-bottom:1px;font-size:0.6rem"><span class="cov-dot" style="background:${c}"></span>${l}</div>`;

  h+=`<div class="sidebar-section"><div class="sidebar-section-title">Connections</div>`;
  h+=`<div style="font-size:0.58rem;display:flex;flex-direction:column;gap:2px">`;

/* ── Tabs ── */
function renderTabs(){
  const c=document.getElementById('templateTabs');
  c.innerHTML=TEMPLATES.map(t=>`<button class="template-tab ${t.id===activeTemplateId?'active':''}" data-tpl="${t.id}">${t.name}</button>`).join('');
  c.querySelectorAll('.template-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{activeTemplateId=btn.dataset.tpl;pinnedBlock=null;volumeView=false;syncViewToggle();renderTabs();renderSidebar();render();});
  });
}
function syncViewToggle(){
  const vt=document.getElementById('viewToggle');
  if(isTelemetry()){ vt.style.display=''; vt.textContent=volumeView?'Path view':'Volume view'; vt.classList.toggle('active',volumeView); }
  else vt.style.display='none';
}
function toggleVolumeView(){ volumeView=!volumeView; syncViewToggle(); renderTelemetry(); }

/* ── Save / Load ── */
function saveConfig(){
  const t=tpl();
  const cfg={
    version:SCHEMA_VERSION,
    template:t.id,
    theme:currentTheme(),
    pathOverrides: t.telemetry ? pathOverrides : {},
    blockStates: blockStates[t.id],
    volumeView: t.telemetry ? volumeView : undefined,
    nodes:[], edges:[],
  };
  const d=new Date(), ymd=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  dl(new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}),`diagram-${t.id}-${ymd}.json`);
}
function loadConfig(ev){
  const f=ev.target.files && ev.target.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    let raw;
    try{ raw=JSON.parse(reader.result); }
    catch(e){ showErr(['File is not valid JSON.', String(e)]); return; }
    const res=normalizeConfig(raw);
    if(!res.ok){ showErr(res.errors); return; }
    const c=res.config;
    if(!TEMPLATES.find(t=>t.id===c.template)){ showErr([`Unknown template "${c.template}".`]); return; }
    activeTemplateId=c.template;
    if(c.blockStates){ blockStates[c.template]=Object.assign({}, blockStates[c.template], c.blockStates); }
    if(c.pathOverrides) pathOverrides=Object.assign({}, c.pathOverrides);
    volumeView = !!c.volumeView;
    if(c.theme) applyTheme(c.theme);
    if(res.errors.length) showErr(res.errors); // non-fatal notices
    pinnedBlock=null; renderTabs(); renderSidebar(); syncViewToggle(); render();
  };
  reader.readAsText(f);
  ev.target.value='';
}
function showErr(list){
  document.getElementById('errModalContent').textContent=list.join('\n');
  document.getElementById('errModal').classList.add('active');
}

/* ── Exports ── */
function exportSVG(){
  const svg=document.getElementById('diagramSvg').cloneNode(true);
  const s=document.createElementNS(NS,'style');
  s.textContent="@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');";
  svg.insertBefore(s,svg.firstChild);
  dl(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}),`${tpl().id}-architecture.svg`);
}
function exportPNG(){
  const t=tpl(),sc=2,svg=document.getElementById('diagramSvg').cloneNode(true);
  const s=document.createElementNS(NS,'style');
  s.textContent="@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');";
  svg.insertBefore(s,svg.firstChild);
  const w=+svg.getAttribute('width'),h=+svg.getAttribute('height');
  svg.setAttribute('width',w*sc);svg.setAttribute('height',h*sc);
  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=w*sc;c.height=h*sc;
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0);
    c.toBlob(b=>{dl(b,`${t.id}-architecture.png`);URL.revokeObjectURL(url);},'image/png');
  };
  img.src=url;
}
function generateMermaid(){
  const t=tpl(),st=blockStates[t.id];
  if(t.telemetry){
    // Simplified flow — swimlanes & volume don't map to Mermaid.
    const lines=['graph LR','  %% Simplified telemetry flow (swimlanes/volume not representable)'];
    const on=activeSources();
    on.forEach(s=>{
      const ap=resolveActivePath(s.id,pathOverrides), pv=PATHS[ap].via;
      const sid2=sid(s.id);
      lines.push(`  ${sid2}["${s.label}"]`);
      if(pv==='direct') lines.push(`  ${sid2} --> NGSIEM["NG-SIEM (LogScale)"]`);
      else lines.push(`  ${sid2} --> ONUM["Falcon Onum"]`);
    });
    if(on.some(s=>PATHS[resolveActivePath(s.id,pathOverrides)].via==='onum')) lines.push('  ONUM --> NGSIEM');
    return lines.join('\n');
  }
  let lines=['graph TD'];
  t.zones.forEach(z=>{const vb=t.blocks.filter(b=>b.zone===z.id&&st[b.id]);if(!vb.length)return;
    lines.push(`  subgraph ${sid(z.id)}["${z.label}"]`);vb.forEach(b=>lines.push(`    ${sid(b.id)}["${b.label}<br/><small>${b.sub}</small>"]`));lines.push('  end');});
  t.connections.forEach(c=>{if(!st[c.from]||!st[c.to])return;const s=c.type==='response'?'-.->':c.type==='data'?'..>':'-->';lines.push(`  ${sid(c.from)} ${s} ${sid(c.to)}`);});
  lines.push('','  classDef native fill:rgba(0,191,207,0.12),stroke:#00BFCF,color:#0a7c86','  classDef hybrid fill:rgba(255,139,0,0.12),stroke:#FF8B00,color:#b3651a',
    '  classDef partner fill:rgba(124,58,237,0.10),stroke:#7C3AED,color:#5a3fcc','  classDef services fill:rgba(255,45,120,0.10),stroke:#FF2D78,color:#c42858');
  t.blocks.forEach(b=>{if(st[b.id])lines.push(`  class ${sid(b.id)} ${b.cov.toLowerCase()}`);});return lines.join('\n');
}
function generateD2(){
  const t=tpl(),st=blockStates[t.id];
  if(t.telemetry){
    const lines=[`# ${t.name}`,`# Simplified telemetry flow — ThinkInfoSec Diagram Builder`,''];
    activeSources().forEach(s=>{
      const ap=resolveActivePath(s.id,pathOverrides), pv=PATHS[ap].via;
      const id2=s.id.replace(/-/g,'_');
      lines.push(`${id2}: "${s.label}"`);
      if(pv==='direct') lines.push(`${id2} -> ngsiem: "${PATHS[ap].label}"`);
      else lines.push(`${id2} -> onum: "${PATHS[ap].label}"`);
    });
    lines.push('onum: "Falcon Onum"');
    lines.push('ngsiem: "NG-SIEM (LogScale)"');
    lines.push('onum -> ngsiem');
    return lines.join('\n');
  }
  let lines=[`# ${t.name}`,`# Generated by ThinkInfoSec Diagram Builder`,''];
  t.zones.forEach(z=>{const vb=t.blocks.filter(b=>b.zone===z.id&&st[b.id]);if(!vb.length)return;
    const zid=z.id.replace(/-/g,'_');lines.push(`${zid}: "${z.label}" {`);
    vb.forEach(b=>lines.push(`  ${b.id.replace(/-/g,'_')}: "${b.label}\\n${b.sub}"`));lines.push('}','');});
  t.connections.forEach(c=>{if(!st[c.from]||!st[c.to])return;
    const fz=t.blocks.find(b=>b.id===c.from)?.zone.replace(/-/g,'_'),tz=t.blocks.find(b=>b.id===c.to)?.zone.replace(/-/g,'_');
    const s=c.type==='response'?'->':'-->';lines.push(`${fz}.${c.from.replace(/-/g,'_')} ${s} ${tz}.${c.to.replace(/-/g,'_')}`);});
  return lines.join('\n');
}
function sid(id){return id.replace(/[^a-zA-Z0-9]/g,'_');}
let codeFormat='mermaid';
function showMermaid(){codeFormat='mermaid';document.getElementById('codeModalTitle').textContent='Mermaid'+(isTelemetry()?' (simplified)':'');document.getElementById('codeModalContent').textContent=generateMermaid();document.getElementById('codeModal').classList.add('active');}
function showD2(){codeFormat='d2';document.getElementById('codeModalTitle').textContent='D2'+(isTelemetry()?' (simplified)':'');document.getElementById('codeModalContent').textContent=generateD2();document.getElementById('codeModal').classList.add('active');}
function copyCode(){navigator.clipboard.writeText(document.getElementById('codeModalContent').textContent).then(()=>{const b=document.querySelector('#codeModal .modal-actions .primary');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy to Clipboard',1500);});}
function downloadCode(){const ext=codeFormat==='mermaid'?'mmd':'d2';dl(new Blob([document.getElementById('codeModalContent').textContent],{type:'text/plain'}),`${tpl().id}.${ext}`);}
function closeModal(){document.getElementById('codeModal').classList.remove('active');}
document.getElementById('codeModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.getElementById('errModal').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('active');});
function dl(blob,fn){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;a.click();URL.revokeObjectURL(a.href);}

/* ── selfTest (dev: append ?test=1) ── */
function selfTest(){
  const problems=[];
  TEMPLATES.forEach(t=>{
    if(t.telemetry){
      telemetrySources().forEach(s=>{
        if(!s.paths.includes(s.defaultPath)) problems.push(`${s.id}: defaultPath not in paths[]`);
        s.outcomes.forEach(o=>{ if(!REG.outcome(o)) problems.push(`${s.id}: unknown outcome ${o}`); });
        s.paths.forEach(p=>{ if(!PATHS[p]) problems.push(`${s.id}: unknown path ${p}`); });
      });
      OUTCOMES.forEach(o=>o.sources.forEach(sid=>{ if(!REG.source(sid)) problems.push(`outcome ${o.id}: unknown source ${sid}`); }));
    } else {
      (t.blocks||[]).forEach(b=>{ if(!t.zones.find(z=>z.id===b.zone)) problems.push(`${t.id}/${b.id}: bad zone`); });
    }
  });
  if(problems.length){ console.error('[diagram-builder selfTest]', problems); }
  else console.log('[diagram-builder selfTest] OK');
  return problems;
}

/* ── INIT ── */
initTheme();
renderTabs(); renderSidebar(); syncViewToggle(); render();
if(/[?&]test=1/.test(location.search)) selfTest();
