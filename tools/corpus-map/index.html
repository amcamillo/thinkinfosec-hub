<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corpus mind map — Thinkinfosec Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7f6;
      --surface: #ffffff;
      --surface-2: #eef2f4;
      --surface-3: #e3e9ed;
      --border: #dddddd;
      --border-strong: #c4ccd4;
      --text: #333333;
      --text-dim: #555555;
      --text-faint: #8a94a0;
      --accent: #0077b5;
      --accent-strong: #005a8c;
      --accent-weak: rgba(0, 119, 181, 0.12);
      --cyan: #00bfcf;
      --magenta: #ff2d78;
      --danger: #d64550;
      --ok: #12a150;
      --shadow: 0 6px 20px rgba(15, 40, 70, 0.08);
      --r-sm: 6px;
      --r-md: 9px;
      --r-lg: 16px;
      --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --navy: var(--text);
      --panel: var(--surface);
      --muted: var(--text-faint);
      --people: var(--magenta);
      --process: var(--cyan);
      --tech: var(--accent);
      --people-fill: #fde8f0;
      --process-fill: #e6f8fa;
      --tech-fill: #e8f3fa;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 3px solid var(--accent-weak);
      outline-offset: 2px;
    }
    .skip {
      position: absolute; left: 0.75rem; top: -3rem;
      background: var(--accent); color: #fff; padding: 0.5rem 0.8rem; z-index: 20;
      text-decoration: none; border-radius: var(--r-sm);
    }
    .skip:focus { top: 0.5rem; }
    header {
      height: 60px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.65rem 1rem;
      padding: 0 16px;
      background: var(--surface); color: var(--text);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header a { color: var(--text-dim); text-decoration: none; font-size: 0.82rem; font-weight: 550; }
    header a:hover { color: var(--accent); }
    header h1 { margin: 0; font-size: 0.95rem; font-weight: 650; }
    header h1 span { color: var(--accent); }
    header .grow { flex: 1; }
    .filter-toggle {
      font: 550 0.82rem var(--font); min-height: 36px; padding: 6px 9px;
      border-radius: var(--r-sm); border: 1px solid transparent;
      background: transparent; color: var(--text-dim); cursor: pointer;
    }
    .filter-toggle:hover { background: var(--surface-2); color: var(--accent); box-shadow: inset 0 0 0 1px var(--border); }
    .filter-toggle[aria-expanded="true"],
    .filter-toggle.has-filters { background: var(--accent); color: #fff; border-color: var(--accent); }
    .filters {
      display: none;
      flex-direction: column;
      gap: 0.85rem;
      padding: 0.85rem 1rem 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      max-height: min(46vh, 420px);
      overflow: auto;
    }
    .filters.open { display: flex; }
    .filter-toolbar {
      display: flex; gap: 0.6rem; align-items: center;
    }
    .filters input[type="search"] {
      font: inherit; min-height: 40px; flex: 1;
      padding: 0.35rem 0.8rem; border: 1px solid var(--border); border-radius: 8px;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem 1rem;
    }
    .filter-section {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.75rem 0.75rem;
    }
    .filter-section h3 {
      margin: 0 0 0.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .chip {
      font: inherit; font-size: 0.78rem; min-height: 34px;
      padding: 0.2rem 0.65rem; border-radius: 8px;
      border: 1px solid var(--border); background: #fff; color: var(--muted);
      cursor: pointer;
    }
    .chip[aria-pressed="true"] { color: #fff; border-color: var(--accent); background: var(--accent); }
    .chip.people[aria-pressed="true"] { color: #9d1a4a; border-color: #f3b3c7; background: var(--people-fill); }
    .chip.process[aria-pressed="true"] { color: #0a6e76; border-color: #9edce2; background: var(--process-fill); }
    .chip.tech[aria-pressed="true"] { color: var(--navy); border-color: #b7c4d4; background: var(--tech-fill); }
    .legend { font-size: 0.75rem; color: var(--muted); display: flex; gap: 0.9rem; flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 0.3rem; }
    .swatch { width: 12px; height: 12px; border-radius: 4px; border: 1px solid var(--border); }
    .workspace { flex: 1; position: relative; min-height: 0; }
    .canvas-wrap {
      position: absolute; inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background-color: var(--bg);
      background-image: radial-gradient(circle, rgba(138,148,160,0.55) 1px, transparent 1px);
      background-size: 16px 16px;
    }
    svg { display: block; width: 100%; height: auto; }
    .hint {
      position: sticky; left: 0.75rem; bottom: 0.75rem; width: max-content;
      font-size: 0.75rem; color: var(--muted); background: rgba(255,255,255,.92);
      padding: 0.35rem 0.55rem; border-radius: 8px; border: 1px solid var(--border);
      margin: 0 0 0.75rem 0.75rem;
    }
    .detail-dock {
      flex-shrink: 0;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }
    .detail-toggle {
      display: flex; align-items: center; gap: 0.75rem; width: 100%;
      min-height: 44px; padding: 0.45rem 1rem;
      font: inherit; text-align: left; cursor: pointer;
      border: 0; background: var(--panel); color: var(--text);
    }
    .detail-toggle:hover { background: var(--surface-2); }
    .detail-toggle[aria-expanded="true"] { border-bottom: 1px solid var(--border); }
    .detail-toggle .chevron { margin-left: auto; color: var(--muted); font-size: 0.8rem; }
    .detail-toggle strong { font-weight: 650; }
    .detail-toggle .meta { color: var(--muted); font-size: 0.8rem; }
    .detail-body {
      display: none;
      max-height: min(38vh, 340px);
      overflow: auto;
      padding: 0.75rem 1rem 1rem;
    }
    .detail-body.open { display: block; }
    .detail-body h2 { margin: 0 0 0.35rem; font-size: 1.05rem; }
    .detail-body .meta { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.75rem; }
    .detail-body a.btn {
      display: inline-flex; align-items: center; min-height: 40px;
      padding: 8px 14px; background: var(--accent); color: #fff;
      text-decoration: none; border-radius: var(--r-md); font-size: 0.85rem; font-weight: 650;
    }
    .detail-body a.btn:hover { background: var(--accent-strong); }
    .list { margin-top: 0.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.5rem 1.25rem; }
    .list details { border-top: 1px solid var(--border); padding: 0.4rem 0; }
    .list a { color: var(--accent); }
    .list a:hover { color: var(--accent-strong); }
    @media (prefers-reduced-motion: reduce) {
      .filters { transition: none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#detail">Skip to artefact list</a>
  <header>
    <a href="../../index.html">← Hub</a>
    <h1>ThinkInfoSec <span>corpus</span></h1>
    <span class="grow"></span>
    <button type="button" class="filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="filters">Filters</button>
  </header>
  <div class="filters" id="filters">
    <div class="filter-toolbar">
      <input type="search" id="q" placeholder="Search artefacts" aria-label="Search artefacts">
      <button type="button" class="chip" id="clear">Clear all</button>
    </div>
    <div class="filter-grid">
      <section class="filter-section">
        <h3>Kind</h3>
        <div class="chip-row" id="filter-kind"></div>
      </section>
      <section class="filter-section">
        <h3>Where it lives</h3>
        <div class="chip-row" id="filter-origin"></div>
      </section>
      <section class="filter-section">
        <h3>People</h3>
        <div class="chip-row" id="filter-people"></div>
      </section>
      <section class="filter-section">
        <h3>Processes</h3>
        <div class="chip-row" id="filter-processes"></div>
      </section>
      <section class="filter-section">
        <h3>Technology</h3>
        <div class="chip-row" id="filter-tech"></div>
      </section>
    </div>
    <div class="legend">
      <span><i class="swatch" style="background:var(--people-fill);border-color:#f3b3c7"></i>People</span>
      <span><i class="swatch" style="background:var(--process-fill);border-color:#9edce2"></i>Processes</span>
      <span><i class="swatch" style="background:var(--tech-fill);border-color:#b7c4d4"></i>Technology</span>
    </div>
  </div>
  <div class="workspace">
    <div class="canvas-wrap" id="canvasWrap">
      <svg id="map" role="img" aria-label="ThinkInfoSec corpus mind map"></svg>
      <div class="hint">Click a tile to open the layer beneath · the map grows downward</div>
    </div>
  </div>
  <div class="detail-dock">
    <button type="button" class="detail-toggle" id="detailToggle" aria-expanded="false" aria-controls="detail">
      <strong id="detailTitle">Details</strong>
      <span class="meta" id="detailSummary">ThinkInfoSec · click a tile, then open this panel</span>
      <span class="chevron" aria-hidden="true">▲</span>
    </button>
    <div class="detail-body" id="detail"></div>
  </div>
  <script src="../../catalog/catalog.js"></script>
  <script src="map.js"></script>
</body>
</html>
