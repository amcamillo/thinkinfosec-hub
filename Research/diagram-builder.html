<style>
:root {

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--sans); background:var(--light-bg); color:var(--text-primary); }
.header {
  background: linear-gradient(135deg, var(--navy), var(--navy-mid));

.header-brand { font-family:var(--mono); font-size:0.65rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--teal); }
.header h1 { font-family:var(--mono); font-size:0.95rem; font-weight:700; }
.header h1 span { color:var(--teal); }
.template-tabs { display:flex; gap:0.3rem; margin-left:auto; }
.template-tab {
  font-family:var(--mono); font-size:0.58rem; letter-spacing:0.04em; padding:0.35rem 0.65rem;
  border:1px solid rgba(255,255,255,0.15); border-radius:3px; background:transparent;
  color:rgba(255,255,255,0.6); cursor:pointer; transition:all 0.15s; text-transform:uppercase;
}
.template-tab:hover { border-color:rgba(255,255,255,0.4); color:#fff; }
.template-tab.active { background:var(--teal); color:var(--navy); border-color:var(--teal); font-weight:700; }
.app { display:flex; height:calc(100vh - 50px); }
.sidebar {
  width:260px; min-width:260px; background:var(--card-bg); border-right:1px solid var(--border);
  overflow-y:auto; padding:0.6rem; flex-shrink:0;
}
.sidebar-section { margin-bottom:0.8rem; }
.sidebar-section-title {
  font-family:var(--mono); font-size:0.55rem; text-transform:uppercase; letter-spacing:0.1em;
  color:var(--text-muted); margin-bottom:0.3rem; padding-bottom:0.25rem; border-bottom:1px solid var(--border);
}
.template-desc { font-size:0.68rem; color:var(--text-secondary); line-height:1.45; margin-bottom:0.6rem; }
.block-toggle {
  display:flex; align-items:center; gap:0.35rem; padding:0.18rem 0; cursor:pointer; user-select:none;
}
.block-toggle:hover { opacity:0.8; }
.block-toggle input[type="checkbox"] { accent-color:var(--teal); width:12px; height:12px; cursor:pointer; }
.block-toggle-label { font-size:0.64rem; color:var(--text-primary); line-height:1.15; }
.block-toggle-sub { font-size:0.52rem; color:var(--text-muted); font-family:var(--mono); }
.block-toggle .cov-dot { width:6px; height:6px; border-radius:2px; flex-shrink:0; }
.zone-group { margin-bottom:0.5rem; }
.zone-group-title { font-size:0.56rem; font-weight:600; color:var(--navy); margin-bottom:0.15rem; text-transform:uppercase; letter-spacing:0.04em; }
.canvas-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.canvas-wrapper {
  flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; padding:0.8rem;
  background: repeating-linear-gradient(0deg,transparent,transparent 19px,rgba(0,0,0,0.012) 19px,rgba(0,0,0,0.012) 20px),

}
#diagramSvg { background:#fff; border-radius:6px; box-shadow:0 2px 10px rgba(10,22,40,0.07); max-width:100%; height:auto; }
.export-bar {
  background:var(--card-bg); border-top:1px solid var(--border); padding:0.4rem 1.5rem;
  display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap;

.export-bar-label { font-family:var(--mono); font-size:0.55rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-right:0.3rem; }

  font-family:var(--mono); font-size:0.55rem; letter-spacing:0.04em; padding:0.3rem 0.6rem;
  border:1px solid var(--border); border-radius:3px; background:var(--card-bg); color:var(--text-secondary); cursor:pointer; transition:all 0.15s;

.export-btn:hover { border-color:var(--navy); color:var(--navy); }
.export-btn.primary { background:var(--navy); color:#fff; border-color:var(--navy); }
.export-btn.primary:hover { background:var(--teal); color:var(--navy); border-color:var(--teal); }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(10,22,40,0.6); z-index:100; align-items:center; justify-content:center; }
.modal-overlay.active { display:flex; }
.modal { background:var(--card-bg); border-radius:8px; padding:1.25rem; width:90%; max-width:700px; max-height:80vh; overflow-y:auto; box-shadow:0 8px 32px rgba(10,22,40,0.2); }
.modal h3 { font-family:var(--mono); font-size:0.75rem; margin-bottom:0.6rem; color:var(--navy); }
.modal pre { background:var(--navy); color:var(--teal); padding:0.75rem; border-radius:4px; font-family:var(--mono); font-size:0.65rem; line-height:1.6; overflow-x:auto; white-space:pre-wrap; }
.modal-actions { display:flex; gap:0.4rem; margin-top:0.75rem; }
.disclaimer {
  font-size:0.52rem; color:var(--text-muted); line-height:1.4; margin-top:0.5rem;
  padding:0.4rem; background:#f7f8fa; border-radius:3px; border-left:2px solid var(--amber);
}
.tooltip {
  display:none; position:fixed; z-index:200; background:var(--navy); color:#fff;
  padding:8px 12px; border-radius:5px; max-width:260px; pointer-events:none;

.tooltip .tip-sub { font-family:var(--mono); font-size:0.56rem; color:#94a3b8; margin-bottom:5px; }

@media (max-width:768px) {

TEMPLATES.forEach(t => { blockStates[t.id] = {}; t.blocks.forEach(b => { blockStates[t.id][b.id] = b.on; }); });
function tpl() { return TEMPLATES.find(t => t.id === activeTemplateId); }
let pinnedBlock = null;

// ═══════════════════════════════════════
// SVG HELPERS
// ═══════════════════════════════════════
const NS = 'http://www.w3.org/2000/svg';
function el(tag,a={}){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e;}
function txt(t,x,y,a={}){const e=el('text',{x,y,...a});e.textContent=t;return e;}

// ═══════════════════════════════════════
// CONNECTION ROUTING
// ═══════════════════════════════════════
function routeConnection(fromId,toId,bp,template,st){
  const fp=bp[fromId],tp=bp[toId];
  if(!fp||!tp)return'';
  const fb=template.blocks.find(b=>b.id===fromId),tb=template.blocks.find(b=>b.id===toId);
  if(!fb||!tb)return'';
  const fz=template.zones.find(z=>z.id===fb.zone),tz=template.zones.find(z=>z.id===tb.zone);
  if(!fz||!tz)return'';
  // Same zone
  if(fz.id===tz.id){
    if(fz.dir==='h'){
      const x1=fp.x+fp.w+2,y1=fp.y+fp.h/2,x2=tp.x-2,y2=tp.y+tp.h/2;
      if(Math.abs(y1-y2)<4)return`M${x1},${y1} L${x2},${y2}`;
      const mx=(x1+x2)/2;
      return`M${x1},${y1} L${mx},${y1} L${mx},${y2} L${x2},${y2}`;
    }
    const x=fp.x+fp.w/2;
    return`M${x},${fp.y+fp.h+2} L${x},${tp.y-2}`;
  }
  // Cross-zone
  const fpCx=fp.x+fp.w/2,tpCx=tp.x+tp.w/2;
  const hOv=Math.min(fz.x+fz.w,tz.x+tz.w)-Math.max(fz.x,tz.x);
  const vOv=Math.min(fz.y+fz.h,tz.y+tz.h)-Math.max(fz.y,tz.y);
  const vGd=tz.y-(fz.y+fz.h),vGu=fz.y-(tz.y+tz.h);
  const hGr=tz.x-(fz.x+fz.w),hGl=fz.x-(tz.x+tz.w);
  // Adjacent vertical down
  if(hOv>30&&vGd>=0&&vGd<25){
    const ex=fpCx,ey=fp.y+fp.h+2,nx=tpCx,ny=tp.y-2,gy=fz.y+fz.h+vGd/2;
    if(Math.abs(ex-nx)<8)return`M${ex},${ey} L${ex},${ny}`;
    return`M${ex},${ey} L${ex},${gy} L${nx},${gy} L${nx},${ny}`;
  }
  // Adjacent vertical up
  if(hOv>30&&vGu>=0&&vGu<25){
    const ex=fpCx,ey=fp.y-2,nx=tpCx,ny=tp.y+tp.h+2,gy=tz.y+tz.h+vGu/2;
    if(Math.abs(ex-nx)<8)return`M${ex},${ey} L${ex},${ny}`;
    return`M${ex},${ey} L${ex},${gy} L${nx},${gy} L${nx},${ny}`;
  }
  // Adjacent horizontal right
  if(vOv>30&&hGr>=0&&hGr<25){
    const ex=fp.x+fp.w+2,ey=fp.y+fp.h/2,nx=tp.x-2,ny=tp.y+tp.h/2,gx=fz.x+fz.w+hGr/2;
    if(Math.abs(ey-ny)<5)return`M${ex},${ey} L${nx},${ny}`;
    return`M${ex},${ey} L${gx},${ey} L${gx},${ny} L${nx},${ny}`;
  }
  // Adjacent horizontal left
  if(vOv>30&&hGl>=0&&hGl<25){
    const ex=fp.x-2,ey=fp.y+fp.h/2,nx=tp.x+tp.w+2,ny=tp.y+tp.h/2,gx=tz.x+tz.w+hGl/2;
    if(Math.abs(ey-ny)<5)return`M${ex},${ey} L${nx},${ny}`;
    return`M${ex},${ey} L${gx},${ey} L${gx},${ny} L${nx},${ny}`;
  }
  // Non-adjacent fallback
  const goD=tp.y>fp.y;
  if(goD){
    const ex=fpCx,ey=fp.y+fp.h+2,nx=tpCx,ny=tp.y-2,wy=fz.y+fz.h+4;
    if(Math.abs(ex-nx)<8)return`M${ex},${ey} L${ex},${ny}`;
    return`M${ex},${ey} L${ex},${wy} L${nx},${wy} L${nx},${ny}`;
  }else{
    const ex=fpCx,ey=fp.y-2,nx=tpCx,ny=tp.y+tp.h+2,wy=fz.y-4;
    if(Math.abs(ex-nx)<8)return`M${ex},${ey} L${ex},${ny}`;
    return`M${ex},${ey} L${ex},${wy} L${nx},${wy} L${nx},${ny}`;
  }
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function render(){
  const t=tpl(),st=blockStates[t.id];
  const svg=document.getElementById('diagramSvg');
  svg.innerHTML='';
  svg.setAttribute('width',t.canvas.w);svg.setAttribute('height',t.canvas.h);
  svg.setAttribute('viewBox',`0 0 ${t.canvas.w} ${t.canvas.h}`);
  // Style for transitions
  svg.appendChild(Object.assign(el('style'),{textContent:'[data-block],[data-conn]{transition:opacity 0.15s ease}'}));
  // Defs
  const defs=el('defs');
  const bsf=el('filter',{id:'bs',x:'-3%',y:'-3%',width:'106%',height:'110%'});
  bsf.appendChild(el('feDropShadow',{dx:'0',dy:'1',stdDeviation:'1.2','flood-color':'rgba(10,22,40,0.05)'}));
  defs.appendChild(bsf);
  Object.entries(CONN_TYPES).forEach(([k,ct])=>{
    const m=el('marker',{id:`ah-${k}`,viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'5',markerHeight:'5',orient:'auto'});
    m.appendChild(el('path',{d:'M0 1.5 L10 5 L0 8.5 z',fill:ct.stroke}));
    defs.appendChild(m);
  });
  svg.appendChild(defs);
  // BG
  svg.appendChild(el('rect',{x:0,y:0,width:t.canvas.w,height:t.canvas.h,fill:'#ffffff',rx:6}));
  // Watermark + Disclaimer
  svg.appendChild(txt('thinkinfosec.org',t.canvas.w-14,t.canvas.h-8,{'text-anchor':'end','font-family':'Space Mono,monospace','font-size':'7',fill:'#d1d5db','letter-spacing':'0.04em'}));
  svg.appendChild(txt(t.name,t.canvas.w-14,t.canvas.h-18,{'text-anchor':'end','font-family':'Space Mono,monospace','font-size':'8','font-weight':'700',fill:'#d1d5db'}));
  svg.appendChild(txt('Visual reference only — not a recommendation or assurance of architectural validity.',20,t.canvas.h-8,{'font-family':'Inter,sans-serif','font-size':'6.5',fill:'#b0b8c4'}));

  // ══ ZONES ══
  t.zones.forEach(z=>{
    const g=el('g',{'data-zone':z.id});
    const fc=z.isServices?'#f8f9fb':z.isSiemBar?'#eaeff5':z.color;
    g.appendChild(el('rect',{x:z.x,y:z.y,width:z.w,height:z.h,rx:4,fill:fc,stroke:z.bc,
      'stroke-width':z.isSiemBar?1.5:z.overlay?1:0.7,
      'stroke-dasharray':z.overlay?'5 3':z.isServices?'3 2':'none'}));
    if(z.isServices)g.appendChild(txt('⚙',z.x+z.w-16,z.y+13,{'font-size':'9',fill:'#94a3b8'}));
    if(!z.isSiemBar)g.appendChild(txt(z.label.toUpperCase(),z.x+8,z.y+13,{
      'font-family':'Space Mono,monospace','font-size':'8','font-weight':'700',fill:z.bc,'letter-spacing':'0.05em',opacity:'0.8'}));
    svg.appendChild(g);
  });

  // ══ BLOCK POSITIONS ══
  const blockPos={};
  t.zones.forEach(z=>{
    const ab=t.blocks.filter(b=>b.zone===z.id);
    if(!ab.length)return;
    if(z.isSiemBar){ab.forEach(b=>{blockPos[b.id]={x:z.x+ZPAD,y:z.y+6,w:z.w-ZPAD*2,h:z.h-12};});return;}
    const isH=z.dir==='h';
    if(isH){
      const bH=BH,avW=z.w-ZPAD*2,bW=Math.min(180,(avW-(ab.length-1)*BGAP)/ab.length);
      const totW=ab.length*bW+(ab.length-1)*BGAP;
      let cx=z.x+(z.w-totW)/2;const cy=z.y+ZHDR+ZPAD;
      ab.forEach((b,i)=>{blockPos[b.id]={x:cx+i*(bW+BGAP),y:cy,w:bW,h:bH};});
    }else{
      const bW=z.w-ZPAD*2;let cy=z.y+ZHDR+ZPAD;
      ab.forEach(b=>{blockPos[b.id]={x:z.x+ZPAD,y:cy,w:bW,h:BH};cy+=BH+BGAP;});
    }
  });

  // ══ CHEVRONS between side-by-side zones ══
  const mz=t.zones.filter(z=>!z.overlay&&!z.isServices&&!z.isSiemBar);
  for(let i=0;i<mz.length-1;i++){
    const a=mz[i],b=mz[i+1];
    if(Math.abs(a.y-b.y)<20){
      const ax=a.x+a.w+1,ay=a.y+a.h/2;
      svg.appendChild(el('path',{d:`M${ax+2},${ay-5} L${ax+7},${ay} L${ax+2},${ay+5}`,fill:'none',stroke:'#d1d5db','stroke-width':'1.2','stroke-linecap':'round'}));
    }
  }

  // ══ CONNECTIONS (behind blocks) ══
  const connLayer=el('g',{opacity:'0.6'});
  t.connections.forEach(conn=>{
    if(!st[conn.from]||!st[conn.to])return;
    if(!blockPos[conn.from]||!blockPos[conn.to])return;
    const type=conn.type||'ops',ct=CONN_TYPES[type];
    const path=routeConnection(conn.from,conn.to,blockPos,t,st);
    if(!path)return;
    connLayer.appendChild(el('path',{d:path,fill:'none',stroke:ct.stroke,'stroke-width':ct.width,
      'stroke-dasharray':ct.dash,'marker-end':`url(#ah-${type})`,'data-conn':`${conn.from}→${conn.to}`,'data-type':type}));
  });
  svg.appendChild(connLayer);

  // ══ BLOCKS ══
  t.blocks.forEach(b=>{
    const pos=blockPos[b.id];if(!pos)return;
    const isA=st[b.id],c=isA?(COV[b.cov]||COV.NATIVE):GHOST;
    const isSB=t.zones.find(z=>z.id===b.zone)?.isSiemBar;
    const g=el('g',{'data-block':b.id});
    if(isA)g.setAttribute('filter','url(#bs)');
    g.style.cursor='pointer';
    // Rect
    g.appendChild(el('rect',{x:pos.x,y:pos.y,width:pos.w,height:pos.h,rx:isSB?4:3,
      fill:isA?'#fff':'none',stroke:c.stroke,'stroke-width':isA?(isSB?1.4:0.8):0.7,
      'stroke-dasharray':isA?'none':'4 3',opacity:isA?1:0.55}));
    // Accent
    g.appendChild(el('rect',{x:pos.x,y:pos.y,width:isSB?4:3,height:pos.h,rx:1.5,fill:c.accent,opacity:isA?1:0.35}));
    // Label
    const maxC=Math.floor(pos.w/5.8);let label=b.label;
    if(label.length>maxC)label=label.substring(0,maxC-1)+'…';
    g.appendChild(txt(label,pos.x+(isSB?12:9),pos.y+(isSB?16:14),{
      'font-family':'Inter,sans-serif','font-size':isSB?'10':'8.5','font-weight':isA?(isSB?'700':'600'):'400',fill:isA?'#0a1628':'#a0aec0'}));
    // Sub (compact — shown smaller)
    if(b.sub){
      const subMax=Math.floor(pos.w/4.2);let sub=b.sub;
      if(sub.length>subMax)sub=sub.substring(0,subMax-1)+'…';
      g.appendChild(txt(sub,pos.x+(isSB?12:9),pos.y+(isSB?28:25),{
        'font-family':'Space Mono,monospace','font-size':isSB?'7':'6.5',fill:isA?c.text:'#cbd5e1','letter-spacing':'0.01em'}));
    }
    // Coverage dot
    if(isA){
      g.appendChild(el('circle',{cx:pos.x+pos.w-10,cy:pos.y+10,r:3.5,fill:c.accent,opacity:'0.8'}));
    }else{
      g.appendChild(txt('GAP',pos.x+pos.w-20,pos.y+12,{'font-family':'Space Mono,monospace','font-size':'5.5','font-weight':'700',fill:'#d1d5db'}));
    }
    svg.appendChild(g);
  });

  // ══ TELEMETRY BUS above SIEM bar ══
  const sb=t.zones.find(z=>z.isSiemBar);
  if(sb){
    const ay=sb.y-3,techW=sb.w;
    const pts=[0.12,0.28,0.44,0.6,0.76,0.92];
    pts.forEach(p=>{
      const ax=sb.x+techW*p;
      svg.appendChild(el('path',{d:`M${ax-3},${ay-4} L${ax},${ay} L${ax+3},${ay-4}`,fill:'none',stroke:'#c4cdd8','stroke-width':'0.8','stroke-linecap':'round'}));
    });
    svg.appendChild(txt('▼ TELEMETRY INGESTION',sb.x+techW/2,ay-7,{
      'text-anchor':'middle','font-family':'Space Mono,monospace','font-size':'5.5',fill:'#b0b8c4','letter-spacing':'0.1em','font-weight':'700'}));
  }

  setupHover();
}

// ═══════════════════════════════════════
// HOVER & TOOLTIP
// ═══════════════════════════════════════
function setupHover(){
  const svg=document.getElementById('diagramSvg');
  svg.querySelectorAll('[data-block]').forEach(g=>{
    g.addEventListener('mouseenter',e=>onHover(g.dataset.block,e));
    g.addEventListener('mouseleave',()=>{if(!pinnedBlock)clearHL();});
    g.addEventListener('click',e=>{
      e.stopPropagation();
      if(pinnedBlock===g.dataset.block){pinnedBlock=null;clearHL();}
      else{pinnedBlock=g.dataset.block;onHover(g.dataset.block,e);}
    });
  });
  svg.addEventListener('click',()=>{if(pinnedBlock){pinnedBlock=null;clearHL();}});
}
function onHover(bid,ev){
  const t=tpl(),st=blockStates[t.id],svg=document.getElementById('diagramSvg');
  const conn=new Set([bid]),cKeys=new Set();
  t.connections.forEach(c=>{
    if(!st[c.from]||!st[c.to])return;
    if(c.from===bid){conn.add(c.to);cKeys.add(`${c.from}→${c.to}`);}
    if(c.to===bid){conn.add(c.from);cKeys.add(`${c.from}→${c.to}`);}
  });
  svg.querySelectorAll('[data-block]').forEach(g=>{g.style.opacity=conn.has(g.dataset.block)?'1':'0.1';});
  svg.querySelectorAll('[data-conn]').forEach(p=>{
    const hl=cKeys.has(p.dataset.conn);
    p.style.opacity=hl?'1':'0.05';
    if(hl)p.setAttribute('stroke-width',String(CONN_TYPES[p.dataset.type||'ops'].width*1.8));
  });
  svg.querySelectorAll('[data-zone]').forEach(g=>{g.style.opacity='0.35';});
  showTip(bid,ev);
}
function clearHL(){
  const svg=document.getElementById('diagramSvg');
  svg.querySelectorAll('[data-block]').forEach(g=>{g.style.opacity='';});
  svg.querySelectorAll('[data-conn]').forEach(p=>{
    p.style.opacity='';p.setAttribute('stroke-width',String(CONN_TYPES[p.dataset.type||'ops'].width));
  });
  svg.querySelectorAll('[data-zone]').forEach(g=>{g.style.opacity='';});
  document.getElementById('tooltip').style.display='none';
}
function showTip(bid,ev){
  const b=tpl().blocks.find(bl=>bl.id===bid);if(!b)return;
  const c=COV[b.cov]||COV.NATIVE;
  const tip=document.getElementById('tooltip');
  tip.innerHTML=`<div class="tip-name">${b.label}</div><div class="tip-sub">${b.sub}</div><span class="tip-badge" style="background:${c.fill};color:${c.text}">${b.cov}</span>`;
  tip.style.display='block';
  const r=tip.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight;
  let lx=ev.clientX+14,ly=ev.clientY-10;
  if(lx+r.width>vw-10)lx=ev.clientX-r.width-10;
  if(ly+r.height>vh-10)ly=ev.clientY-r.height-10;
  tip.style.left=lx+'px';tip.style.top=ly+'px';
}

// ═══════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════
function renderSidebar(){
  const t=tpl(),st=blockStates[t.id],sb=document.getElementById('sidebar');
  let h=`<div class="template-desc">${t.desc}</div>`;
  const groups={};t.blocks.forEach(b=>{if(!groups[b.zone])groups[b.zone]=[];groups[b.zone].push(b);});
  h+=`<div class="sidebar-section"><div class="sidebar-section-title">Domains — Toggle to add/remove</div>`;
  const tz=t.zones.filter(z=>!z.isServices),sz=t.zones.filter(z=>z.isServices);
  [...tz,...sz].forEach(z=>{
    if(!groups[z.id])return;
    h+=`<div class="zone-group"><div class="zone-group-title">${z.isServices?'⚙ ':z.isSiemBar?'▬ ':''}${z.label}</div>`;
    groups[z.id].forEach(b=>{
      const c=COV[b.cov]||COV.NATIVE;
      h+=`<label class="block-toggle"><input type="checkbox" data-block="${b.id}" ${st[b.id]?'checked':''}><span class="cov-dot" style="background:${c.accent}"></span><span><span class="block-toggle-label">${b.label}</span><br><span class="block-toggle-sub">${b.sub}</span></span></label>`;
    });
    h+=`</div>`;
  });
  h+=`</div>`;
  // Legend
  h+=`<div class="sidebar-section"><div class="sidebar-section-title">Coverage</div>`;
  [['NATIVE','Native Module','#00d4aa'],['HYBRID','CS + Partner','#ffa502'],['PARTNER','Partner-Led','#7c5cff'],['SERVICES','Managed Service','#ff3e7f']].forEach(([k,l,c])=>{
    h+=`<div style="display:flex;align-items:center;gap:4px;margin-bottom:1px;font-size:0.6rem"><span class="cov-dot" style="background:${c}"></span>${l}</div>`;
  });
  h+=`<div style="display:flex;align-items:center;gap:4px;margin-top:3px;font-size:0.6rem;color:#a0aec0"><span style="width:16px;height:1px;border-top:2px dashed #d1d5db;display:inline-block"></span>Gap / upsell</div>`;
  h+=`</div>`;
  // Connection legend
  h+=`<div class="sidebar-section"><div class="sidebar-section-title">Connections</div>`;
  h+=`<div style="font-size:0.58rem;display:flex;flex-direction:column;gap:2px">`;
  h+=`<div style="display:flex;align-items:center;gap:5px"><span style="width:18px;height:2px;background:#00d4aa;display:inline-block;border-radius:1px"></span>Operational chain</div>`;
  h+=`<div style="display:flex;align-items:center;gap:5px"><span style="width:18px;height:0;border-top:2px dashed #ff3e7f;display:inline-block"></span>Response action</div>`;
  h+=`<div style="display:flex;align-items:center;gap:5px"><span style="width:18px;height:0;border-top:2px dotted #7c5cff;display:inline-block"></span>Data flow</div>`;
  h+=`<div style="display:flex;align-items:center;gap:5px;color:#a0aec0"><span style="font-size:0.7rem">▼▼</span>Telemetry ingestion</div>`;
  h+=`</div></div>`;
  h+=`<div class="disclaimer">${DISCLAIMER}</div>`;
  sb.innerHTML=h;
  sb.querySelectorAll('input[data-block]').forEach(cb=>{
    cb.addEventListener('change',()=>{st[cb.dataset.block]=cb.checked;pinnedBlock=null;render();});
  });
}

// ═══════════════════════════════════════
// TABS
// ═══════════════════════════════════════
function renderTabs(){
  const c=document.getElementById('templateTabs');
  c.innerHTML=TEMPLATES.map(t=>`<button class="template-tab ${t.id===activeTemplateId?'active':''}" data-tpl="${t.id}">${t.name}</button>`).join('');
  c.querySelectorAll('.template-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{activeTemplateId=btn.dataset.tpl;pinnedBlock=null;renderTabs();renderSidebar();render();});
  });
}

// EXPORTS
// ═══════════════════════════════════════
function exportSVG(){
  const svg=document.getElementById('diagramSvg').cloneNode(true);
  const s=document.createElementNS(NS,'style');
  s.textContent="@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');";
  svg.insertBefore(s,svg.firstChild);
  dl(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}),`${tpl().id}-architecture.svg`);
}
function exportPNG(){
  const t=tpl(),sc=2,svg=document.getElementById('diagramSvg').cloneNode(true);
  const s=document.createElementNS(NS,'style');
  s.textContent="@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');";
  svg.insertBefore(s,svg.firstChild);
  svg.setAttribute('width',t.canvas.w*sc);svg.setAttribute('height',t.canvas.h*sc);
  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=t.canvas.w*sc;c.height=t.canvas.h*sc;
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0);
    c.toBlob(b=>{dl(b,`${t.id}-architecture.png`);URL.revokeObjectURL(url);},'image/png');
  };
  img.src=url;
}
function generateMermaid(){
  const t=tpl(),st=blockStates[t.id];let lines=['graph TD'];
  t.zones.forEach(z=>{const vb=t.blocks.filter(b=>b.zone===z.id&&st[b.id]);if(!vb.length)return;
    lines.push(`  subgraph ${sid(z.id)}["${z.label}"]`);vb.forEach(b=>lines.push(`    ${sid(b.id)}["${b.label}<br/><small>${b.sub}</small>"]`));lines.push('  end');});
  t.connections.forEach(c=>{if(!st[c.from]||!st[c.to])return;const s=c.type==='response'?'-.->':c.type==='data'?'..>':'-->';lines.push(`  ${sid(c.from)} ${s} ${sid(c.to)}`);});
  lines.push('','  classDef native fill:#e6faf4,stroke:#00d4aa,color:#00896e','  classDef hybrid fill:#fff6e6,stroke:#ffa502,color:#b37300',
    '  classDef partner fill:#f0ecff,stroke:#7c5cff,color:#5a3fcc','  classDef services fill:#ffe8f0,stroke:#ff3e7f,color:#c42858');
  t.blocks.forEach(b=>{if(st[b.id])lines.push(`  class ${sid(b.id)} ${b.cov.toLowerCase()}`);});return lines.join('\n');
}
function generateD2(){
  const t=tpl(),st=blockStates[t.id];let lines=[`# ${t.name}`,`# Generated by ThinkInfoSec Diagram Builder`,''];
  t.zones.forEach(z=>{const vb=t.blocks.filter(b=>b.zone===z.id&&st[b.id]);if(!vb.length)return;
    const zid=z.id.replace(/-/g,'_');lines.push(`${zid}: "${z.label}" {`);lines.push(`  style.fill: "${z.color}"`);
    vb.forEach(b=>lines.push(`  ${b.id.replace(/-/g,'_')}: "${b.label}\\n${b.sub}"`));lines.push('}','');});
  t.connections.forEach(c=>{if(!st[c.from]||!st[c.to])return;
    const fz=t.blocks.find(b=>b.id===c.from)?.zone.replace(/-/g,'_'),tz=t.blocks.find(b=>b.id===c.to)?.zone.replace(/-/g,'_');
    const s=c.type==='response'?'->':'-->';lines.push(`${fz}.${c.from.replace(/-/g,'_')} ${s} ${tz}.${c.to.replace(/-/g,'_')}`);});
  return lines.join('\n');
}
function sid(id){return id.replace(/[^a-zA-Z0-9]/g,'_');}
let codeFormat='mermaid';
function showMermaid(){codeFormat='mermaid';document.getElementById('codeModalTitle').textContent='Mermaid';document.getElementById('codeModalContent').textContent=generateMermaid();document.getElementById('codeModal').classList.add('active');}
function showD2(){codeFormat='d2';document.getElementById('codeModalTitle').textContent='D2';document.getElementById('codeModalContent').textContent=generateD2();document.getElementById('codeModal').classList.add('active');}
function copyCode(){navigator.clipboard.writeText(document.getElementById('codeModalContent').textContent).then(()=>{const b=document.querySelector('.modal-actions .primary');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy to Clipboard',1500);});}
function downloadCode(){const ext=codeFormat==='mermaid'?'mmd':'d2';dl(new Blob([document.getElementById('codeModalContent').textContent],{type:'text/plain'}),`${tpl().id}.${ext}`);}
function closeModal(){document.getElementById('codeModal').classList.remove('active');}
document.getElementById('codeModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
function dl(blob,fn){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;a.click();URL.revokeObjectURL(a.href);}

renderTabs();renderSidebar();render();
</script>
