<script>// thinkinfosec-visuals animation runtime, inlined into <name>.animated.html for every type except flow.
// Data: JSON in a tv-anim data block: { steps:[{a,effect,at,dur}], hold, fade, gap }
// Shapes opt in with data-a="<target>". Rendering is a pure function of time, so the GIF capture can seek.
// API: window.flowAnim = { period, end, seek(ms), play(), pause() }, the same contract as the flow runtime.
(() => {
  const D = JSON.parse(document.getElementById('tv-anim').textContent);
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.querySelector('.diagram svg');
  const ease = p => 1 - Math.pow(1 - p, 3);
  const clamp = v => Math.max(0, Math.min(1, v));
  const fmt = (el, v) => {
    const [ip, fp] = v.toFixed(+(el.dataset.decimals || 0)).split('.');
    const s = (el.dataset.sep ? ip.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : ip) + (fp != null ? '.' + fp : '');
    return (el.dataset.prefix || '') + s + (el.dataset.suffix || '');
  };
  const colorOf = el => el.dataset.glow || el.getAttribute('stroke') || el.getAttribute('fill') || '#fff';

  const byEl = new Map();
  for (const s of D.steps) for (const el of svg.querySelectorAll(`[data-a="${CSS.escape(s.a)}"]`)) {
    if (!byEl.has(el)) byEl.set(el, []);
    byEl.get(el).push(s);
  }
  for (const [el, list] of byEl) {
    const grows = list.some(s => s.effect === 'grow'), bottom = el.dataset.origin === 'bottom';
    el.style.transformBox = 'fill-box';
    el.style.transformOrigin = grows ? (bottom ? 'center bottom' : 'left center') : 'center';
    if (list.some(s => s.effect === 'draw') && el.getTotalLength && !el.getAttribute('stroke-dasharray')) {
      const L = el.getTotalLength(); el.dataset.len = L; el.style.strokeDasharray = `${L} ${L}`;
      el.dataset.marker = el.getAttribute('marker-end') || '';
    }
    if (list.some(s => s.effect === 'travel') && el.getTotalLength) {
      const dot = document.createElementNS(NS, 'circle');
      dot.setAttribute('r', '3.6'); dot.setAttribute('fill', colorOf(el));
      dot.style.filter = `drop-shadow(0 0 4px ${colorOf(el)})`;
      el.parentNode.appendChild(dot); el._dot = dot;
    }
  }

  const end = Math.max(0, ...D.steps.map(s => s.at + s.dur));
  const period = end + D.hold + D.fade + D.gap;

  function render(t) {
    svg.style.opacity = String(1 - (t > end + D.hold ? clamp((t - end - D.hold) / D.fade) : 0));
    for (const [el, list] of byEl) {
      let opacity = 1, scale = 1, sx = 1, glow = 0;
      for (const s of list) {
        const raw = clamp((t - s.at) / s.dur), p = ease(raw), started = raw > 0;
        if (s.effect === 'pop') { opacity *= started ? p : 0; scale *= 0.9 + 0.1 * p; }
        else if (s.effect === 'fade') opacity *= started ? p : 0;
        else if (s.effect === 'grow') { sx *= p; if (!started) opacity = 0; }
        else if (s.effect === 'draw') {
          if (el.dataset.len) {
            el.style.strokeDashoffset = String(+el.dataset.len * (1 - p)); if (!started) opacity = 0;
            // the arrowhead appears only once the line has reached it
            if (el.dataset.marker) { if (raw >= 1) el.setAttribute('marker-end', el.dataset.marker); else el.removeAttribute('marker-end'); }
          }
          else opacity *= started ? p : 0;
        }
        else if (s.effect === 'count' && el.dataset.count != null) el.textContent = fmt(el, +el.dataset.count * p);
        else if (s.effect === 'travel' && el._dot) {
          const pt = el.getPointAtLength(el.getTotalLength() * p);
          el._dot.style.display = started && raw < 1 ? '' : 'none';
          el._dot.setAttribute('cx', pt.x); el._dot.setAttribute('cy', pt.y);
        }
        else if (s.effect === 'glow') glow = Math.max(glow, !started ? 0 : raw < 0.5 ? raw * 2 : Math.max(0.35, 1 - (raw - 0.5) * 1.3));
      }
      el.style.opacity = String(opacity);
      el.style.transform = [sx !== 1 ? (el.dataset.origin === 'bottom' ? `scaleY(${sx})` : `scaleX(${sx})`) : '', scale !== 1 ? `scale(${scale})` : ''].join(' ').trim();
      el.style.filter = glow > 0 ? `drop-shadow(0 0 ${(8 * glow).toFixed(1)}px ${colorOf(el)})` : '';
    }
  }

  let raf = 0, t0 = null, playing = false;
  const loop = now => { if (t0 == null) t0 = now; render((now - t0) % period); raf = requestAnimationFrame(loop); };
  const api = {
    period, end,
    seek(ms) { cancelAnimationFrame(raf); render(((ms % period) + period) % period); },
    play() { cancelAnimationFrame(raf); t0 = null; raf = requestAnimationFrame(loop); },
    pause() { cancelAnimationFrame(raf); },
  };
  window.flowAnim = api;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { render(end); return; }
  render(0);
  if (/[?&]capture\b/.test(location.search)) return;
  new IntersectionObserver(es => { for (const e of es) {
    if (e.isIntersecting && !playing) { playing = true; api.play(); }
    else if (!e.isIntersecting && playing) { playing = false; api.pause(); render(0); }
  } }, { threshold: 0.25 }).observe(svg);
  svg.addEventListener('click', () => { playing = !playing; playing ? api.play() : api.pause(); });
})();
</script>
</body></html>
