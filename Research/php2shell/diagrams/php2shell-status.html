<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four sentences, four thresholds</title>
<style>
:root { --tis-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.tx-tag    { font: 700 9.5px var(--tis-font); letter-spacing: 1.3px; text-transform: uppercase; }
.tx-title  { font: 700 15px var(--tis-font); letter-spacing: -.1px; }
.tx-sub    { font: 400 11.5px var(--tis-font); }
.tx-label  { font: 500 11px var(--tis-font); }
.tx-glabel { font: 800 10.5px var(--tis-font); letter-spacing: 1.8px; text-transform: uppercase; }
.tx-gnote  { font: 400 11px var(--tis-font); }
.tx-pill   { font: 600 11px var(--tis-font); }
.tx-gate   { font: 700 11px var(--tis-font); }
.tx-note   { font: 500 11px var(--tis-font); font-style: italic; }

:root {
  --tis-magenta:#FF2D78; --tis-magenta-2:#D91E63; --tis-teal:#00BFCF; --tis-teal-2:#0B6459; --tis-navy:#0D1F3C;
  --tis-ink:#FFFFFF; --tis-mute:rgba(255,255,255,.68); --tis-line:rgba(255,255,255,.16);
  --tis-glass:rgba(6,10,18,.56); --tis-glass-2:rgba(6,10,18,.72);
}
* { box-sizing: border-box; }
html, body { background: var(--tis-navy); }
body { margin: 0; overflow-x: hidden; font-family: var(--tis-font); color: var(--tis-ink); }
.stage { position: relative; overflow: hidden; background: var(--tis-navy); min-height: 100vh; }
.stage .zone { position: absolute; inset: 0; }
.stage .zone-magenta { background: linear-gradient(77deg, #FF2D78 0%, #D91E63 18%, #8C2060 38%, #4A1D52 58%, rgba(13,31,60,.35) 76%, rgba(13,31,60,0) 92%); }
.stage .zone-teal { background: linear-gradient(57deg, rgba(13,31,60,0) 8%, rgba(13,31,60,.35) 24%, #0F3A4A 44%, #0B6459 64%, #009AAB 82%, #00BFCF 100%); }
.stage .wash  { background: rgba(6,10,18,.14); }
.stage .grain { background-image: radial-gradient(rgba(255,255,255,.5) .5px, transparent .5px); background-size: 4px 4px; opacity: .035; }
.wrap { position: relative; z-index: 1; padding: 44px 16px; display: flex; justify-content: center; }
.panel { background: var(--tis-glass-2); -webkit-backdrop-filter: blur(20px) saturate(140%); backdrop-filter: blur(20px) saturate(140%);
  border: 1px solid var(--tis-line); border-radius: 18px; padding: 28px 30px 24px; width: 100%; }
.eyebrow { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--tis-mute); margin: 0 0 10px; }
.eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; }
h1 { font-size: clamp(1.6rem, 3.4vw, 2.3rem); font-weight: 900; letter-spacing: -.5px; margin: 0 0 8px; text-wrap: balance; }
.caption { color: var(--tis-mute); font-size: .95rem; line-height: 1.6; margin: 0 0 22px; max-width: 78ch; }
.diagram { overflow-x: auto; margin: 0 -6px; padding: 0 6px; }
.diagram svg { display: block; width: 100%; height: auto; min-width: 760px; margin: 0 auto; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--tis-line); font-size: 12px; color: var(--tis-mute); }
.legend span { display: inline-flex; align-items: center; gap: 9px; }
.legend svg { flex: none; }
/* diagram primitives */
.n-box   { fill: rgba(8,14,26,.82); stroke: rgba(255,255,255,.15); stroke-width: 1; }
.ghost .n-box { fill: rgba(8,14,26,.35); stroke: rgba(255,255,255,.34); stroke-dasharray: 5 4; }
.tx-title { fill: #fff; }
.tx-sub   { fill: rgba(255,255,255,.62); }
.tx-gnote { fill: rgba(255,255,255,.55); }
.tx-note  { fill: rgba(255,255,255,.6); }
.g-box    { stroke-width: 1; }
.port     { fill: #0b1422; stroke-width: 1.3; }

.panel { max-width: 1140px; }
.diagram svg { min-width: 760px; }
</style></head>
<body><div class="stage"><div class="zone zone-magenta"></div><div class="zone zone-teal"></div><div class="zone wash"></div><div class="zone grain"></div>
<main class="wrap"><section class="panel">
<p class="eyebrow">ThinkInfoSec · Exploitation</p>
<h1>Four sentences, four thresholds</h1>
<p class="caption">These are not steps in one story. Each box is the verb that source used, with its date. The patch decision does not wait for the verbs to match.</p>
<figure class="diagram" style="margin:0"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -28 1078 122" width="1078" style="max-width:1078px" role="img" aria-label="PHP Foundation, CISA, the Cyber Centre, and Vercel plus Cloudflare each describe a different exploitation threshold. All four still sit above a same-week patch."><defs><marker id="ah-flow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="rgba(255,255,255,.58)"/></marker><marker id="ah-conditional" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#FF2D78"/></marker><marker id="ah-optional" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="rgba(255,255,255,.82)"/></marker><marker id="ah-reference" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#00BFCF"/></marker></defs>
<path data-e="0" d="M148,33 L250.5,33" fill="none" stroke="#00BFCF" stroke-width="1.4" stroke-dasharray="1.5 4.5" stroke-linecap="round" marker-end="url(#ah-reference)"/>
<path data-e="1" d="M398.5,33 L442.5,33" fill="none" stroke="#00BFCF" stroke-width="1.4" stroke-dasharray="1.5 4.5" stroke-linecap="round" marker-end="url(#ah-reference)"/>
<path data-e="2" d="M590.5,33 L634.5,33" fill="none" stroke="#00BFCF" stroke-width="1.4" stroke-dasharray="1.5 4.5" stroke-linecap="round" marker-end="url(#ah-reference)"/>
<path data-e="3" d="M785.5,33 L873.5,33" fill="none" stroke="#FF2D78" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah-conditional)"/>
<circle class="port" cx="148" cy="33" r="3.4" stroke="#00BFCF"/>
<circle class="port" cx="398.5" cy="33" r="3.4" stroke="#00BFCF"/>
<circle class="port" cx="590.5" cy="33" r="3.4" stroke="#00BFCF"/>
<circle class="port" cx="785.5" cy="33" r="3.4" stroke="#FF2D78"/>
<g class="node" data-id="phpf"><rect class="n-box" x="0" y="0" width="148" height="66" rx="10"/><circle cx="17" cy="17.5" r="3.2" fill="rgba(255,255,255,.62)"/><text class="tx-tag" x="26" y="21" fill="rgba(255,255,255,.62)">21 Oct</text><text class="tx-title" x="14" y="41">PHP Foundation</text><text class="tx-sub" x="14" y="56">no functional PoC then</text></g>
<g class="node" data-id="cisa"><rect class="n-box" x="250.5" y="0" width="148" height="66" rx="10"/><circle cx="267.5" cy="17.5" r="3.2" fill="rgba(255,255,255,.62)"/><text class="tx-tag" x="276.5" y="21" fill="rgba(255,255,255,.62)">23 Oct</text><text class="tx-title" x="264.5" y="41">CISA</text><text class="tx-sub" x="264.5" y="56">success not observed</text></g>
<g class="node" data-id="cc"><rect class="n-box" x="442.5" y="0" width="148" height="66" rx="10"/><circle cx="459.5" cy="17.5" r="3.2" fill="rgba(255,255,255,.62)"/><text class="tx-tag" x="468.5" y="21" fill="rgba(255,255,255,.62)">23 Oct</text><text class="tx-title" x="456.5" y="41">Cyber Centre</text><text class="tx-sub" x="456.5" y="56">PoC, not identified</text></g>
<g class="node" data-id="vend"><rect class="n-box" x="634.5" y="0" width="151" height="66" rx="10"/><circle cx="651.5" cy="17.5" r="3.2" fill="#FF2D78"/><text class="tx-tag" x="660.5" y="21" fill="#FF2D78">21 Oct</text><text class="tx-title" x="648.5" y="41">Vercel, Cloudflare</text><text class="tx-sub" x="648.5" y="56">exploits and traffic</text></g>
<g class="node" data-id="go"><rect class="n-box" x="873.5" y="0" width="148" height="66" rx="10"/><circle cx="890.5" cy="17.5" r="3.2" fill="#00BFCF"/><text class="tx-tag" x="899.5" y="21" fill="#00BFCF">Decision</text><text class="tx-title" x="887.5" y="41">Patch this week</text><text class="tx-sub" x="887.5" y="56">above every line</text></g>
<text class="tx-label" x="168" y="22.5" fill="#5FDCE6">different bar</text>
<text class="tx-label" x="805.5" y="22.5" fill="#FF7FAA">still patch</text></svg></figure>
<div class="legend"><span><svg width="30" height="8" viewBox="0 0 30 8" aria-hidden="true"><line x1="1" y1="4" x2="29" y2="4" stroke="#00BFCF" stroke-width="1.6" stroke-dasharray="1.5 4.5" stroke-linecap="round"/></svg>a dated statement, not a sequence</span><span><svg width="30" height="8" viewBox="0 0 30 8" aria-hidden="true"><line x1="1" y1="4" x2="29" y2="4" stroke="#FF2D78" stroke-width="1.6" stroke-dasharray="6 4"/></svg>attempts are not confirmed compromise</span></div>
</section></main></div></body></html>
