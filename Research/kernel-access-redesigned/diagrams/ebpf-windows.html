<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>eBPF for Windows</title>
<style>
:root { --tis-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.tx-tag    { font: 700 9.5px var(--tis-font); letter-spacing: 1.3px; text-transform: uppercase; }
.tx-title  { font: 700 15px var(--tis-font); letter-spacing: -.1px; }
.tx-sub    { font: 400 11.5px var(--tis-font); }
.tx-label  { font: 500 11px var(--tis-font); }
.tx-glabel { font: 800 10.5px var(--tis-font); letter-spacing: 1.8px; text-transform: uppercase; }
.tx-gnote  { font: 400 11px var(--tis-font); }
.tx-pill   { font: 600 11px var(--tis-font); }
.tx-gate   { font: 700 11px var(--tis-font); }
.tx-note   { font: 500 11px var(--tis-font); font-style: italic; }

:root {
  --tis-magenta:#FF2D78; --tis-magenta-2:#D91E63; --tis-teal:#00BFCF; --tis-teal-2:#0B6459; --tis-navy:#0D1F3C;
  --tis-ink:#FFFFFF; --tis-mute:rgba(255,255,255,.68); --tis-line:rgba(255,255,255,.16);
  --tis-glass:rgba(6,10,18,.56); --tis-glass-2:rgba(6,10,18,.72);
}
* { box-sizing: border-box; }
html, body { background: var(--tis-navy); }
body { margin: 0; overflow-x: hidden; font-family: var(--tis-font); color: var(--tis-ink); }
.stage { position: relative; overflow: hidden; background: var(--tis-navy); min-height: 100vh; }
.stage .zone { position: absolute; inset: 0; }
.stage .zone-magenta { background: linear-gradient(77deg, #FF2D78 0%, #D91E63 18%, #8C2060 38%, #4A1D52 58%, rgba(13,31,60,.35) 76%, rgba(13,31,60,0) 92%); }
.stage .zone-teal { background: linear-gradient(57deg, rgba(13,31,60,0) 8%, rgba(13,31,60,.35) 24%, #0F3A4A 44%, #0B6459 64%, #009AAB 82%, #00BFCF 100%); }
.stage .wash  { background: rgba(6,10,18,.14); }
.stage .grain { background-image: radial-gradient(rgba(255,255,255,.5) .5px, transparent .5px); background-size: 4px 4px; opacity: .035; }
.wrap { position: relative; z-index: 1; padding: 44px 16px; display: flex; justify-content: center; }
.panel { background: var(--tis-glass-2); -webkit-backdrop-filter: blur(20px) saturate(140%); backdrop-filter: blur(20px) saturate(140%);
  border: 1px solid var(--tis-line); border-radius: 18px; padding: 28px 30px 24px; width: 100%; }
.eyebrow { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--tis-mute); margin: 0 0 10px; }
.eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; }
h1 { font-size: clamp(1.6rem, 3.4vw, 2.3rem); font-weight: 900; letter-spacing: -.5px; margin: 0 0 8px; text-wrap: balance; }
.caption { color: var(--tis-mute); font-size: .95rem; line-height: 1.6; margin: 0 0 22px; max-width: 78ch; }
.diagram { overflow-x: auto; margin: 0 -6px; padding: 0 6px; }
.diagram svg { display: block; width: 100%; height: auto; min-width: 760px; margin: 0 auto; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--tis-line); font-size: 12px; color: var(--tis-mute); }
.legend span { display: inline-flex; align-items: center; gap: 9px; }
.legend svg { flex: none; }
/* diagram primitives */
.n-box   { fill: rgba(8,14,26,.82); stroke: rgba(255,255,255,.15); stroke-width: 1; }
.ghost .n-box { fill: rgba(8,14,26,.35); stroke: rgba(255,255,255,.34); stroke-dasharray: 5 4; }
.tx-title { fill: #fff; }
.tx-sub   { fill: rgba(255,255,255,.62); }
.tx-gnote { fill: rgba(255,255,255,.55); }
.tx-note  { fill: rgba(255,255,255,.6); }
.g-box    { stroke-width: 1; }
.port     { fill: #0b1422; stroke-width: 1.3; }

.panel { max-width: 1037px; }
.diagram svg { min-width: 760px; }
</style></head>
<body><div class="stage"><div class="zone zone-magenta"></div><div class="zone zone-teal"></div><div class="zone wash"></div><div class="zone grain"></div>
<main class="wrap"><section class="panel">
<p class="eyebrow">ThinkInfoSec · Windows</p>
<h1>eBPF for Windows</h1>
<p class="caption">The verifier runs in a secure user-mode environment. Verified programs then load into a kernel-mode execution context. Verified, yes. Out of the kernel, no.</p>
<figure class="diagram" style="margin:0"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -28 975 320" width="975" style="max-width:975px" role="img" aria-label="An eBPF program is verified in user mode, then loaded into a kernel-mode execution context. With HVCI it cannot be JIT-compiled and runs as a native Windows driver. Verified, yes. Out of the kernel, no."><defs><marker id="ah-flow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="rgba(255,255,255,.58)"/></marker><marker id="ah-conditional" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#FF2D78"/></marker><marker id="ah-optional" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="rgba(255,255,255,.82)"/></marker><marker id="ah-reference" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#00BFCF"/></marker></defs>
<g class="group" data-id="user"><rect class="g-box" x="192" y="0" width="204" height="138" rx="18" fill="rgba(0,191,207,.06)" stroke="rgba(0,191,207,.38)"/>
<text class="tx-glabel" x="220" y="29" fill="#00BFCF">User mode</text>
</g>
<g class="group" data-id="kern"><rect class="g-box" x="483.4" y="0" width="434.7" height="138" rx="18" fill="rgba(255,45,120,.06)" stroke="rgba(255,45,120,.42)"/>
<text class="tx-glabel" x="511.4" y="29" fill="#FF2D78">Still in the kernel</text>
</g>
<path data-e="0" d="M148,83 L220,83" fill="none" stroke="rgba(255,255,255,.58)" stroke-width="1.4" marker-end="url(#ah-flow)"/>
<path data-e="1" d="M368,83 L511.4,83" fill="none" stroke="rgba(255,255,255,.58)" stroke-width="1.4" marker-end="url(#ah-flow)"/>
<path data-e="2" d="M664.4,83 L734,83" fill="none" stroke="#FF2D78" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah-conditional)"/>
<path data-e="3" d="M700.7,138 L700.7,198" fill="none" stroke="#00BFCF" stroke-width="1.4" stroke-dasharray="1.5 4.5" stroke-linecap="round" marker-end="url(#ah-reference)"/>
<circle class="port" cx="148" cy="83" r="3.4" stroke="rgba(255,255,255,.58)"/>
<circle class="port" cx="368" cy="83" r="3.4" stroke="rgba(255,255,255,.58)"/>
<circle class="port" cx="664.4" cy="83" r="3.4" stroke="#FF2D78"/>
<circle class="port" cx="700.7" cy="138" r="3.4" stroke="#00BFCF"/>
<g class="node" data-id="prog"><rect class="n-box" x="0" y="50" width="148" height="66" rx="10"/><circle cx="17" cy="67.5" r="3.2" fill="rgba(255,255,255,.62)"/><text class="tx-tag" x="26" y="71" fill="rgba(255,255,255,.62)">Submit</text><text class="tx-title" x="14" y="91">eBPF program</text><text class="tx-sub" x="14" y="106">bytecode in</text></g>
<g class="node" data-id="ver"><rect class="n-box" x="220" y="50" width="148" height="66" rx="10"/><circle cx="237" cy="67.5" r="3.2" fill="#00BFCF"/><text class="tx-tag" x="246" y="71" fill="#00BFCF">User mode</text><text class="tx-title" x="234" y="91">Verifier</text><text class="tx-sub" x="234" y="106">secure user-mode env</text></g>
<g class="node" data-id="ctx"><rect class="n-box" x="511.4" y="50" width="153" height="66" rx="10"/><circle cx="528.4" cy="67.5" r="3.2" fill="#FF2D78"/><text class="tx-tag" x="537.4" y="71" fill="#FF2D78">Kernel mode</text><text class="tx-title" x="525.4" y="91">Execution context</text><text class="tx-sub" x="525.4" y="106">programs load here</text></g>
<g class="node ghost" data-id="hvci"><rect class="n-box" x="734" y="50" width="156" height="66" rx="10"/><circle cx="751" cy="67.5" r="3.2" fill="#FF2D78"/><text class="tx-tag" x="760" y="71" fill="#FF2D78">HVCI enabled</text><text class="tx-title" x="748" y="91">Native mode</text><text class="tx-sub" x="748" y="106">a regular Windows driver</text></g>
<g class="node" data-id="no"><rect class="n-box" x="626.7" y="198" width="148" height="66" rx="10"/><circle cx="643.7" cy="215.5" r="3.2" fill="#FF2D78"/><text class="tx-title" x="640.7" y="239">Verified, yes</text><text class="tx-sub" x="640.7" y="254">Out of the kernel, no</text></g>
<text class="tx-label" x="416" y="72.5" fill="rgba(255,255,255,.66)">then load</text>
<text class="tx-label" x="684.4" y="72.5" fill="#FF7FAA">no JIT</text></svg></figure>
<div class="legend"><span><svg width="30" height="8" viewBox="0 0 30 8" aria-hidden="true"><line x1="1" y1="4" x2="29" y2="4" stroke="rgba(255,255,255,.58)" stroke-width="1.6"/></svg>load path</span><span><svg width="30" height="8" viewBox="0 0 30 8" aria-hidden="true"><line x1="1" y1="4" x2="29" y2="4" stroke="#FF2D78" stroke-width="1.6" stroke-dasharray="6 4"/></svg>when HVCI is on</span><span><svg width="30" height="8" viewBox="0 0 30 8" aria-hidden="true"><line x1="1" y1="4" x2="29" y2="4" stroke="#00BFCF" stroke-width="1.6" stroke-dasharray="1.5 4.5" stroke-linecap="round"/></svg>verified, still in the kernel</span></div>
</section></main></div></body></html>
