<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
</head>
<body>
  <template id="ebpf-pipeline-template">
    <style>
    @font-face {
      font-family: "Newsreader";
      src: url("../assets/fonts/newsreader-latin.woff2") format("woff2");
      font-weight: 500 700;
      font-style: normal;
      font-display: block;
    }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    [data-composition-id="ebpf-pipeline"] {
      background: #0D1F3C;
      color: #F4F7F6;
      font-family: "Newsreader", serif;
    }
    [data-composition-id="ebpf-pipeline"] .ep-scene {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 52px 72px 44px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-sizing: border-box;
      overflow: hidden;
    }
    [data-composition-id="ebpf-pipeline"] .ep-glow,
    [data-composition-id="ebpf-pipeline"] .ep-ghost,
    [data-composition-id="ebpf-pipeline"] .ep-grid {
      position: absolute;
      pointer-events: none;
    }
    [data-composition-id="ebpf-pipeline"] .ep-glow-a {
      width: 880px; height: 880px; left: -220px; top: -280px;
      background: radial-gradient(circle, rgba(0,191,207,0.20), transparent 68%);
    }
    [data-composition-id="ebpf-pipeline"] .ep-glow-b {
      width: 760px; height: 760px; right: -200px; bottom: -300px;
      background: radial-gradient(circle, rgba(255,45,120,0.14), transparent 70%);
    }
    [data-composition-id="ebpf-pipeline"] .ep-grid {
      inset: -48px;
      background-image:
        linear-gradient(rgba(0,191,207,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,191,207,0.045) 1px, transparent 1px);
      background-size: 88px 88px;
    }
    [data-composition-id="ebpf-pipeline"] .ep-ghost {
      right: -20px; bottom: -46px;
      font-family: "Newsreader", serif;
      font-weight: 700;
      font-size: 220px;
      letter-spacing: -0.04em;
      line-height: 0.8;
      color: #00BFCF;
      opacity: 0.07;
      white-space: nowrap;
    }
    [data-composition-id="ebpf-pipeline"] .ep-head { display: flex; flex-direction: column; gap: 8px; z-index: 1; }
    [data-composition-id="ebpf-pipeline"] .ep-meta {
      display: flex; justify-content: space-between; align-items: baseline;
      font-family: "IBM Plex Mono", monospace;
      font-size: 18px; letter-spacing: 0.08em; color: #00BFCF;
    }
    [data-composition-id="ebpf-pipeline"] .ep-kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 20px; color: #D5E4E6; letter-spacing: 0.02em;
    }
    [data-composition-id="ebpf-pipeline"] .ep-title {
      font-size: 64px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.02;
      max-width: 1600px;
    }
    [data-composition-id="ebpf-pipeline"] .ep-rule {
      height: 2px; width: 280px; background: #00BFCF; transform-origin: left center; margin-top: 6px;
    }
    [data-composition-id="ebpf-pipeline"] .ep-board {
      flex: 1; min-height: 0; z-index: 1;
      display: flex; flex-direction: column; justify-content: center; gap: 18px;
    }
    [data-composition-id="ebpf-pipeline"] .ep-row { display: flex; align-items: stretch; gap: 16px; min-height: 0; }
    [data-composition-id="ebpf-pipeline"] .ep-card {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; justify-content: center; gap: 8px;
      padding: 20px 22px;
      min-height: 168px;
      background: #16304C;
      border: 1px solid rgba(213,228,230,0.24);
      border-radius: 10px;
    }
    [data-composition-id="ebpf-pipeline"] .ep-teal { border: 2px solid #00BFCF; }
    [data-composition-id="ebpf-pipeline"] .ep-magenta { border: 2px solid #FF2D78; }
    [data-composition-id="ebpf-pipeline"] .ep-dashed {
      background: transparent;
      border-style: dashed;
    }
    [data-composition-id="ebpf-pipeline"] .ep-tag {
      font-family: "IBM Plex Mono", monospace;
      font-size: 16px; letter-spacing: 0.04em; color: #D5E4E6;
      font-variant-numeric: tabular-nums;
    }
    [data-composition-id="ebpf-pipeline"] .ep-teal > .ep-tag,
    [data-composition-id="ebpf-pipeline"] .ep-tag.ep-teal { color: #00BFCF; }
    [data-composition-id="ebpf-pipeline"] .ep-magenta > .ep-tag,
    [data-composition-id="ebpf-pipeline"] .ep-tag.ep-magenta { color: #FFB4C8; }
    [data-composition-id="ebpf-pipeline"] .ep-card h2 {
      font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.08; color: #F4F7F6;
    }
    [data-composition-id="ebpf-pipeline"] .ep-sub {
      font-family: "IBM Plex Mono", monospace;
      font-size: 20px; line-height: 1.3; color: #D5E4E6;
    }
    [data-composition-id="ebpf-pipeline"] .ep-arrow, [data-composition-id="ebpf-pipeline"] .ep-pill {
      flex: 0 0 auto; align-self: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: 22px; color: #00BFCF; letter-spacing: 0.02em;
      transform-origin: left center;
    }
    [data-composition-id="ebpf-pipeline"] .ep-pill {
      border: 1px solid #00BFCF; border-radius: 999px; padding: 8px 14px; font-size: 18px;
    }
    [data-composition-id="ebpf-pipeline"] .ep-pill.ep-magenta {
      color: #FFB4C8; border-color: #FF2D78; border-style: dashed;
    }
    [data-composition-id="ebpf-pipeline"] .ep-group {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; gap: 12px;
      padding: 16px 18px 18px;
      border: 1px solid rgba(213,228,230,0.28);
      border-radius: 14px;
    }
    [data-composition-id="ebpf-pipeline"] .ep-group.ep-teal { border-color: rgba(0,191,207,0.75); }
    [data-composition-id="ebpf-pipeline"] .ep-group.ep-magenta { border-color: rgba(255,45,120,0.8); }
    [data-composition-id="ebpf-pipeline"] .ep-glabel {
      font-family: "IBM Plex Mono", monospace;
      font-size: 18px; letter-spacing: 0.06em; color: #D5E4E6;
    }
    [data-composition-id="ebpf-pipeline"] .ep-teal > .ep-glabel { color: #00BFCF; }
    [data-composition-id="ebpf-pipeline"] .ep-magenta > .ep-glabel { color: #FFB4C8; }
    [data-composition-id="ebpf-pipeline"] .ep-gnote {
      font-family: "IBM Plex Mono", monospace;
      font-size: 18px; color: #D5E4E6;
    }
    [data-composition-id="ebpf-pipeline"] .ep-caption {
      z-index: 1;
      font-size: 26px; line-height: 1.32; color: #F4F7F6; max-width: 1680px;
    }
    [data-composition-id="ebpf-pipeline"] .ep-join {
      height: 2px; background: #00BFCF; transform-origin: left center;
    }
    [data-composition-id="ebpf-pipeline"] .ep-split { display: flex; gap: 28px; align-items: center; }
    [data-composition-id="ebpf-pipeline"] .ep-grid2 {
      display: grid; grid-template-columns: 1fr 1fr; gap: 22px; min-height: 0; flex: 1;
    }
    [data-composition-id="ebpf-pipeline"] .ep-verdict, [data-composition-id="ebpf-pipeline"] .ep-rice {
      border-radius: 12px; padding: 18px 28px;
      display: flex; flex-direction: column; gap: 6px; justify-content: center;
    }
    [data-composition-id="ebpf-pipeline"] .ep-verdict { border: 2px solid #FF2D78; background: #16304C; }
    [data-composition-id="ebpf-pipeline"] .ep-verdict h2 { font-size: 48px; font-weight: 700; letter-spacing: -0.03em; }
    [data-composition-id="ebpf-pipeline"] .ep-rice {
      border: 2px dashed rgba(213,228,230,0.45); background: transparent;
    }
    [data-composition-id="ebpf-pipeline"] .ep-rice h2 { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
    [data-composition-id="ebpf-pipeline"] .ep-attach { display: flex; justify-content: flex-end; padding-right: 6%; }
  </style>
    <div id="root" data-composition-id="ebpf-pipeline" data-width="1920" data-height="1080" data-duration="8">
      <div class="ep-scene" id="ep-scene">
        
    <div class="ep-grid" id="ep-grid" data-layout-ignore="true"></div>
    <div class="ep-glow ep-glow-a" id="ep-glow-a" data-layout-ignore="true"></div>
    <div class="ep-glow ep-glow-b" id="ep-glow-b" data-layout-ignore="true"></div>
    <div class="ep-ghost" id="ep-ghost" data-layout-ignore="true">eBPF</div>
        
    <header class="ep-head">
      <div class="ep-meta">
        <span id="ep-series">Kernel-Access Redesigned</span>
        <span id="ep-index">01 / 08</span>
      </div>
      <p class="ep-kicker" id="ep-kicker">Linux and eBPF</p>
      <h1 class="ep-title" id="ep-title">The eBPF pipeline</h1>
      <div class="ep-rule" id="ep-rule"></div>
    </header>
        <div class="ep-board" id="ep-board">
          
    <div class="ep-row">
      <article class="ep-card" id="ep-bc"><p class="ep-tag">01 · submit</p><h2>Bytecode</h2><p class="ep-sub">not native machine code</p></article>
      <span class="ep-arrow" id="ep-a1">→</span>
      <article class="ep-card ep-teal" id="ep-ver"><p class="ep-tag">02 · check</p><h2>Verifier</h2><p class="ep-sub">checks it before it runs</p></article>
      <span class="ep-arrow" id="ep-a2">→</span>
      <article class="ep-card ep-teal" id="ep-jit"><p class="ep-tag">03 · compile</p><h2>JIT compiler</h2><p class="ep-sub">approved result, native</p></article>
      <span class="ep-arrow" id="ep-a3">→</span>
      <article class="ep-card ep-magenta" id="ep-nat"><p class="ep-tag">04 · Ring 0</p><h2>Native code</h2><p class="ep-sub">runs in the kernel</p></article>
    </div>
    <div class="ep-attach"><span class="ep-pill" id="ep-attach">attach</span></div>
    <div class="ep-group ep-teal" id="ep-hooks">
      <p class="ep-glabel" id="ep-glabel">Same LSM hooks</p>
      <p class="ep-gnote" id="ep-gnote">no loadable kernel module</p>
      <div class="ep-row">
        <article class="ep-card" id="ep-sel"><h2>SELinux</h2><p class="ep-sub">existing LSM hook</p></article>
        <article class="ep-card" id="ep-app"><h2>AppArmor</h2><p class="ep-sub">existing LSM hook</p></article>
        <article class="ep-card ep-teal" id="ep-lsm"><p class="ep-tag">KRSI</p><h2>BPF-LSM</h2><p class="ep-sub">programs attach here</p></article>
      </div>
    </div>
        </div>
        <p class="ep-caption" id="ep-caption">Instead of native machine code, you submit bytecode. A verifier checks it, a JIT turns the approved result into native instructions, and BPF-LSM attaches to the same hooks SELinux and AppArmor use.</p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

      tl.fromTo("#ep-a1", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.28, ease: "power2.inOut" }, 0.78);
      tl.fromTo("#ep-ver", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.86);
      tl.fromTo("#ep-a2", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.26, ease: "power2.inOut" }, 1.02);
      tl.fromTo("#ep-jit", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "circ.out" }, 1.08);

      tl.fromTo("#ep-nat", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.44, ease: "expo.out" }, 1.28);
      tl.fromTo("#ep-attach", { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.36, ease: "back.out(1.4)" }, 1.5);
      tl.fromTo("#ep-hooks", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 1.62);
      tl.fromTo("#ep-caption", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "sine.out" }, 2.15);
  
      window.__timelines["ebpf-pipeline"] = tl;
    </script>
  </template>
</body>
</html>
