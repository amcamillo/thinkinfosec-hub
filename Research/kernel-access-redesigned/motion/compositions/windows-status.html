<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
</head>
<body>
  <template id="windows-status-template">
    <style>
    @font-face {
      font-family: "Newsreader";
      src: url("../assets/fonts/newsreader-latin.woff2") format("woff2");
      font-weight: 500 700;
      font-style: normal;
      font-display: block;
    }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    [data-composition-id="windows-status"] {
      background: #0D1F3C;
      color: #F4F7F6;
      font-family: "Newsreader", serif;
    }
    [data-composition-id="windows-status"] .ws-scene {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 52px 72px 44px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-sizing: border-box;
      overflow: hidden;
    }
    [data-composition-id="windows-status"] .ws-glow,
    [data-composition-id="windows-status"] .ws-ghost,
    [data-composition-id="windows-status"] .ws-grid {
      position: absolute;
      pointer-events: none;
    }
    [data-composition-id="windows-status"] .ws-glow-a {
      width: 880px; height: 880px; left: -220px; top: -280px;
      background: radial-gradient(circle, rgba(0,191,207,0.20), transparent 68%);
    }
    [data-composition-id="windows-status"] .ws-glow-b {
      width: 760px; height: 760px; right: -200px; bottom: -300px;
      background: radial-gradient(circle, rgba(255,45,120,0.14), transparent 70%);
    }
    [data-composition-id="windows-status"] .ws-grid {
      inset: -48px;
      background-image:
        linear-gradient(rgba(0,191,207,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,191,207,0.045) 1px, transparent 1px);
      background-size: 88px 88px;
    }
    [data-composition-id="windows-status"] .ws-ghost {
      right: -20px; bottom: -46px;
      font-family: "Newsreader", serif;
      font-weight: 700;
      font-size: 220px;
      letter-spacing: -0.04em;
      line-height: 0.8;
      color: #00BFCF;
      opacity: 0.07;
      white-space: nowrap;
    }
    [data-composition-id="windows-status"] .ws-head { display: flex; flex-direction: column; gap: 8px; z-index: 1; }
    [data-composition-id="windows-status"] .ws-meta {
      display: flex; justify-content: space-between; align-items: baseline;
      font-family: "IBM Plex Mono", monospace;
      font-size: 18px; letter-spacing: 0.08em; color: #00BFCF;
    }
    [data-composition-id="windows-status"] .ws-kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 20px; color: #D5E4E6; letter-spacing: 0.02em;
    }
    [data-composition-id="windows-status"] .ws-title {
      font-size: 64px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.02;
      max-width: 1600px;
    }
    [data-composition-id="windows-status"] .ws-rule {
      height: 2px; width: 280px; background: #00BFCF; transform-origin: left center; margin-top: 6px;
    }
    [data-composition-id="windows-status"] .ws-board {
      flex: 1; min-height: 0; z-index: 1;
      display: flex; flex-direction: column; justify-content: center; gap: 18px;
    }
    [data-composition-id="windows-status"] .ws-row { display: flex; align-items: stretch; gap: 16px; min-height: 0; }
    [data-composition-id="windows-status"] .ws-card {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; justify-content: center; gap: 8px;
      padding: 20px 22px;
      min-height: 168px;
      background: #16304C;
      border: 1px solid rgba(213,228,230,0.24);
      border-radius: 10px;
    }
    [data-composition-id="windows-status"] .ws-teal { border: 2px solid #00BFCF; }
    [data-composition-id="windows-status"] .ws-magenta { border: 2px solid #FF2D78; }
    [data-composition-id="windows-status"] .ws-dashed {
      background: transparent;
      border-style: dashed;
    }
    [data-composition-id="windows-status"] .ws-tag {
      font-family: "IBM Plex Mono", monospace;
      font-size: 16px; letter-spacing: 0.04em; color: #D5E4E6;
      font-variant-numeric: tabular-nums;
    }
    [data-composition-id="windows-status"] .ws-teal > .ws-tag,
    [data-composition-id="windows-status"] .ws-tag.ws-teal { color: #00BFCF; }
    [data-composition-id="windows-status"] .ws-magenta > .ws-tag,
    [data-composition-id="windows-status"] .ws-tag.ws-magenta { color: #FFB4C8; }
    [data-composition-id="windows-status"] .ws-card h2 {
      font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.08; color: #F4F7F6;
    }
    [data-composition-id="windows-status"] .ws-sub {
      font-family: "IBM Plex Mono", monospace;
      font-size: 20px; line-height: 1.3; color: #D5E4E6;
    }
    [data-composition-id="windows-status"] .ws-arrow, [data-composition-id="windows-status"] .ws-pill {
      flex: 0 0 auto; align-self: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: 22px; color: #00BFCF; letter-spacing: 0.02em;
      transform-origin: left center;
    }
    [data-composition-id="windows-status"] .ws-pill {
      border: 1px solid #00BFCF; border-radius: 999px; padding: 8px 14px; font-size: 18px;
    }
    [data-composition-id="windows-status"] .ws-pill.ws-magenta {
      color: #FFB4C8; border-color: #FF2D78; border-style: dashed;
    }
    [data-composition-id="windows-status"] .ws-group {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; gap: 12px;
      padding: 16px 18px 18px;
      border: 1px solid rgba(213,228,230,0.28);
      border-radius: 14px;
    }
    [data-composition-id="windows-status"] .ws-group.ws-teal { border-color: rgba(0,191,207,0.75); }
    [data-composition-id="windows-status"] .ws-group.ws-magenta { border-color: rgba(255,45,120,0.8); }
    [data-composition-id="windows-status"] .ws-glabel {
      font-family: "IBM Plex Mono", monospace;
      font-size: 18px; letter-spacing: 0.06em; color: #D5E4E6;
    }
    [data-composition-id="windows-status"] .ws-teal > .ws-glabel { color: #00BFCF; }
    [data-composition-id="windows-status"] .ws-magenta > .ws-glabel { color: #FFB4C8; }
    [data-composition-id="windows-status"] .ws-gnote {
      font-family: "IBM Plex Mono", monospace;
      font-size: 18px; color: #D5E4E6;
    }
    [data-composition-id="windows-status"] .ws-caption {
      z-index: 1;
      font-size: 26px; line-height: 1.32; color: #F4F7F6; max-width: 1680px;
    }
    [data-composition-id="windows-status"] .ws-join {
      height: 2px; background: #00BFCF; transform-origin: left center;
    }
    [data-composition-id="windows-status"] .ws-split { display: flex; gap: 28px; align-items: center; }
    [data-composition-id="windows-status"] .ws-grid2 {
      display: grid; grid-template-columns: 1fr 1fr; gap: 22px; min-height: 0; flex: 1;
    }
    [data-composition-id="windows-status"] .ws-verdict, [data-composition-id="windows-status"] .ws-rice {
      border-radius: 12px; padding: 18px 28px;
      display: flex; flex-direction: column; gap: 6px; justify-content: center;
    }
    [data-composition-id="windows-status"] .ws-verdict { border: 2px solid #FF2D78; background: #16304C; }
    [data-composition-id="windows-status"] .ws-verdict h2 { font-size: 48px; font-weight: 700; letter-spacing: -0.03em; }
    [data-composition-id="windows-status"] .ws-rice {
      border: 2px dashed rgba(213,228,230,0.45); background: transparent;
    }
    [data-composition-id="windows-status"] .ws-rice h2 { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
    [data-composition-id="windows-status"] .ws-attach { display: flex; justify-content: flex-end; padding-right: 6%; }
  </style>
    <div id="root" data-composition-id="windows-status" data-width="1920" data-height="1080" data-duration="8">
      <div class="ws-scene" id="ws-scene">
        
    <div class="ws-grid" id="ws-grid" data-layout-ignore="true"></div>
    <div class="ws-glow ws-glow-a" id="ws-glow-a" data-layout-ignore="true"></div>
    <div class="ws-glow ws-glow-b" id="ws-glow-b" data-layout-ignore="true"></div>
    <div class="ws-ghost" id="ws-ghost" data-layout-ignore="true">WESP</div>
        
    <header class="ws-head">
      <div class="ws-meta">
        <span id="ws-series">Kernel-Access Redesigned</span>
        <span id="ws-index">06 / 08</span>
      </div>
      <p class="ws-kicker" id="ws-kicker">Windows</p>
      <h1 class="ws-title" id="ws-title">Where the Windows package stands</h1>
      <div class="ws-rule" id="ws-rule"></div>
    </header>
        <div class="ws-board" id="ws-board">
          
    <p class="ws-glabel" id="ws-pack">The package</p>
    <div class="ws-grid2">
      <article class="ws-card ws-magenta" id="ws-wesp"><p class="ws-tag">Private preview</p><h2>WESP</h2><p class="ws-sub">not general availability</p></article>
      <article class="ws-card ws-magenta" id="ws-sys"><p class="ws-tag">Insiders only</p><h2>Native Sysmon</h2><p class="ws-sub">off by default</p></article>
      <article class="ws-card ws-teal" id="ws-mem"><p class="ws-tag">From Oct 2026</p><h2>Memory integrity</h2><p class="ws-sub">staged default, not enforced</p></article>
      <article class="ws-card" id="ws-qmr"><p class="ws-tag">Shipping</p><h2>Quick Machine Recovery</h2><p class="ws-sub">recovers boots only</p></article>
    </div>
        </div>
        <p class="ws-caption" id="ws-caption">WESP is a private preview. Native Sysmon is Insiders only and off by default. Memory integrity is a staged default from October 2026. Quick Machine Recovery ships, and it recovers boots.</p>
      </div>
    </div>

  </template>
</body>
