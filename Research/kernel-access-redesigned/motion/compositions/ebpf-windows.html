<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
</head>
<body>
  <template id="ebpf-windows-template">
    <style>
    @font-face {
      font-family: "Newsreader";
      src: url("../assets/fonts/newsreader-latin.woff2") format("woff2");
      font-weight: 500 700;
      font-style: normal;
      font-display: block;
    }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    [data-composition-id="ebpf-windows"] {
      background: #0D1F3C;
      color: #F4F7F6;
      font-family: "Newsreader", serif;
    }
    [data-composition-id="ebpf-windows"] .ew-scene {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 52px 72px 44px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-sizing: border-box;
      overflow: hidden;
    }
    [data-composition-id="ebpf-windows"] .ew-glow,
    [data-composition-id="ebpf-windows"] .ew-ghost,
    [data-composition-id="ebpf-windows"] .ew-grid {
      position: absolute;
      pointer-events: none;
    }
    [data-composition-id="ebpf-windows"] .ew-glow-a {
      width: 880px; height: 880px; left: -220px; top: -280px;
      background: radial-gradient(circle, rgba(0,191,207,0.20), transparent 68%);
    }
    [data-composition-id="ebpf-windows"] .ew-glow-b {
      width: 760px; height: 760px; right: -200px; bottom: -300px;
      background: radial-gradient(circle, rgba(255,45,120,0.14), transparent 70%);
    }
    [data-composition-id="ebpf-windows"] .ew-grid {
      inset: -48px;
      background-image:
        linear-gradient(rgba(0,191,207,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,191,207,0.045) 1px, transparent 1px);
      background-size: 88px 88px;
    }
    [data-composition-id="ebpf-windows"] .ew-ghost {
      right: -20px; bottom: -46px;
      font-family: "Newsreader", serif;
      font-weight: 700;
      font-size: 220px;
      letter-spacing: -0.04em;
      line-height: 0.8;
      color: #00BFCF;
      opacity: 0.07;
      white-space: nowrap;
    }
    [data-composition-id="ebpf-windows"] .ew-head { display: flex; flex-direction: column; gap: 8px; z-index: 1; }
    [data-composition-id="ebpf-windows"] .ew-meta {
      display: flex; justify-content: space-between; align-items: baseline;
      font-family: "IBM Plex Mono", monospace;
      font-size: 18px; letter-spacing: 0.08em; color: #00BFCF;
    }
    [data-composition-id="ebpf-windows"] .ew-kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 20px; color: #D5E4E6; letter-spacing: 0.02em;
    }
    [data-composition-id="ebpf-windows"] .ew-title {
      font-size: 64px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.02;
      max-width: 1600px;
    }
    [data-composition-id="ebpf-windows"] .ew-rule {
      height: 2px; width: 280px; background: #00BFCF; transform-origin: left center; margin-top: 6px;
    }
    [data-composition-id="ebpf-windows"] .ew-board {
      flex: 1; min-height: 0; z-index: 1;
      display: flex; flex-direction: column; justify-content: center; gap: 18px;
    }
    [data-composition-id="ebpf-windows"] .ew-row { display: flex; align-items: stretch; gap: 16px; min-height: 0; }
    [data-composition-id="ebpf-windows"] .ew-card {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; justify-content: center; gap: 8px;
      padding: 20px 22px;
      min-height: 168px;
      background: #16304C;
      border: 1px solid rgba(213,228,230,0.24);
      border-radius: 10px;
    }
    [data-composition-id="ebpf-windows"] .ew-teal { border: 2px solid #00BFCF; }
    [data-composition-id="ebpf-windows"] .ew-magenta { border: 2px solid #FF2D78; }
    [data-composition-id="ebpf-windows"] .ew-dashed {
      background: transparent;
      border-style: dashed;
    }
    [data-composition-id="ebpf-windows"] .ew-tag {
      font-family: "IBM Plex Mono", monospace;
      font-size: 16px; letter-spacing: 0.04em; color: #D5E4E6;
      font-variant-numeric: tabular-nums;
    }
    [data-composition-id="ebpf-windows"] .ew-teal > .ew-tag,
    [data-composition-id="ebpf-windows"] .ew-tag.ew-teal { color: #00BFCF; }
    [data-composition-id="ebpf-windows"] .ew-magenta > .ew-tag,
    [data-composition-id="ebpf-windows"] .ew-tag.ew-magenta { color: #FFB4C8; }
    [data-composition-id="ebpf-windows"] .ew-card h2 {
      font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.08; color: #F4F7F6;
    }
    [data-composition-id="ebpf-windows"] .ew-sub {
      font-family: "IBM Plex Mono", monospace;
      font-size: 20px; line-height: 1.3; color: #D5E4E6;
    }
    [data-composition-id="ebpf-windows"] .ew-arrow, [data-composition-id="ebpf-windows"] .ew-pill {
      flex: 0 0 auto; align-self: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: 22px; color: #00BFCF; letter-spacing: 0.02em;
      transform-origin: left center;
    }
    [data-composition-id="ebpf-windows"] .ew-pill {
      border: 1px solid #00BFCF; border-radius: 999px; padding: 8px 14px; font-size: 18px;
    }
    [data-composition-id="ebpf-windows"] .ew-pill.ew-magenta {
      color: #FFB4C8; border-color: #FF2D78; border-style: dashed;
    }
    [data-composition-id="ebpf-windows"] .ew-group {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; gap: 12px;
      padding: 16px 18px 18px;
      border: 1px solid rgba(213,228,230,0.28);
      border-radius: 14px;
    }
    [data-composition-id="ebpf-windows"] .ew-group.ew-teal { border-color: rgba(0,191,207,0.75); }
    [data-composition-id="ebpf-windows"] .ew-group.ew-magenta { border-color: rgba(255,45,120,0.8); }
    [data-composition-id="ebpf-windows"] .ew-glabel {
      font-family: "IBM Plex Mono", monospace;
      font-size: 18px; letter-spacing: 0.06em; color: #D5E4E6;
    }
    [data-composition-id="ebpf-windows"] .ew-teal > .ew-glabel { color: #00BFCF; }
    [data-composition-id="ebpf-windows"] .ew-magenta > .ew-glabel { color: #FFB4C8; }
    [data-composition-id="ebpf-windows"] .ew-gnote {
      font-family: "IBM Plex Mono", monospace;
      font-size: 18px; color: #D5E4E6;
    }
    [data-composition-id="ebpf-windows"] .ew-caption {
      z-index: 1;
      font-size: 26px; line-height: 1.32; color: #F4F7F6; max-width: 1680px;
    }
    [data-composition-id="ebpf-windows"] .ew-join {
      height: 2px; background: #00BFCF; transform-origin: left center;
    }
    [data-composition-id="ebpf-windows"] .ew-split { display: flex; gap: 28px; align-items: center; }
    [data-composition-id="ebpf-windows"] .ew-grid2 {
      display: grid; grid-template-columns: 1fr 1fr; gap: 22px; min-height: 0; flex: 1;
    }
    [data-composition-id="ebpf-windows"] .ew-verdict, [data-composition-id="ebpf-windows"] .ew-rice {
      border-radius: 12px; padding: 18px 28px;
      display: flex; flex-direction: column; gap: 6px; justify-content: center;
    }
    [data-composition-id="ebpf-windows"] .ew-verdict { border: 2px solid #FF2D78; background: #16304C; }
    [data-composition-id="ebpf-windows"] .ew-verdict h2 { font-size: 48px; font-weight: 700; letter-spacing: -0.03em; }
    [data-composition-id="ebpf-windows"] .ew-rice {
      border: 2px dashed rgba(213,228,230,0.45); background: transparent;
    }
    [data-composition-id="ebpf-windows"] .ew-rice h2 { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
    [data-composition-id="ebpf-windows"] .ew-attach { display: flex; justify-content: flex-end; padding-right: 6%; }
  </style>
    <div id="root" data-composition-id="ebpf-windows" data-width="1920" data-height="1080" data-duration="8">
      <div class="ew-scene" id="ew-scene">
        
    <div class="ew-grid" id="ew-grid" data-layout-ignore="true"></div>
    <div class="ew-glow ew-glow-a" id="ew-glow-a" data-layout-ignore="true"></div>
    <div class="ew-glow ew-glow-b" id="ew-glow-b" data-layout-ignore="true"></div>
    <div class="ew-ghost" id="ew-ghost" data-layout-ignore="true">HVCI</div>
        
    <header class="ew-head">
      <div class="ew-meta">
        <span id="ew-series">Kernel-Access Redesigned</span>
        <span id="ew-index">07 / 08</span>
      </div>
      <p class="ew-kicker" id="ew-kicker">Windows</p>
      <h1 class="ew-title" id="ew-title">eBPF for Windows</h1>
      <div class="ew-rule" id="ew-rule"></div>
    </header>
        <div class="ew-board" id="ew-board">
          
    <div class="ew-row">
      <article class="ew-card" id="ew-prog"><p class="ew-tag">Submit</p><h2>eBPF program</h2><p class="ew-sub">bytecode in</p></article>
      <span class="ew-arrow" id="ew-submit">→</span>
      <section class="ew-group ew-teal" id="ew-user">
        <p class="ew-glabel" id="ew-user-label">User mode</p>
        <article class="ew-card ew-teal" id="ew-ver"><p class="ew-tag">User mode</p><h2>Verifier</h2><p class="ew-sub">secure user-mode env</p></article>
      </section>
      <span class="ew-pill" id="ew-load">then load</span>
      <section class="ew-group ew-magenta" id="ew-kern">
        <p class="ew-glabel" id="ew-kern-label">Still in the kernel</p>
        <div class="ew-row">
          <article class="ew-card ew-magenta" id="ew-ctx"><p class="ew-tag">Kernel mode</p><h2>Execution context</h2><p class="ew-sub">programs load here</p></article>
          <span class="ew-pill ew-magenta" id="ew-nojit">no JIT</span>
          <article class="ew-card ew-magenta ew-dashed" id="ew-hvci"><p class="ew-tag">HVCI enabled</p><h2>Native mode</h2><p class="ew-sub">a regular Windows driver</p></article>
        </div>
      </section>
    </div>
    <div class="ew-verdict" id="ew-no">
      <h2 id="ew-yes">Verified, yes</h2>
      <p class="ew-sub" id="ew-out">Out of the kernel, no</p>
    </div>
        </div>
        <p class="ew-caption" id="ew-caption">The verifier runs in a secure user-mode environment. Verified programs then load into a kernel-mode execution context. Verified, yes. Out of the kernel, no.</p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      tl.fromTo("#ew-glow-b", { y: 20 }, { y: -16, duration: 7.0, ease: "sine.inOut" }, 0.2);
      tl.fromTo("#ew-glow-a", { scale: 1.02 }, { scale: 1.08, duration: 6.2, ease: "power1.inOut" }, 0.35);
      tl.fromTo("#ew-ghost", { opacity: 0, y: 12 }, { opacity: 0.07, y: 0, duration: 0.8, ease: "power1.out" }, 0.2);
      tl.fromTo("#ew-series", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "sine.out" }, 0.16);
      tl.fromTo("#ew-index", { x: 10, opacity: 0 }, { x: 0, opacity: 1, duration: 0.32, ease: "power2.out" }, 0.22);
      tl.fromTo("#ew-kicker", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "circ.out" }, 0.24);
      tl.fromTo("#ew-title", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power4.out" }, 0.3);
      tl.fromTo("#ew-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.44, ease: "power3.inOut" }, 0.48);
      tl.fromTo("#ew-prog", { x: -28, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 0.62);
      tl.fromTo("#ew-submit", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.26, ease: "power2.inOut" }, 0.82);
      tl.fromTo("#ew-user", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.46, ease: "power3.out" }, 0.9);
      tl.fromTo("#ew-load", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.3)" }, 1.15);
      tl.fromTo("#ew-kern", { x: 32, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 1.22);
      tl.fromTo("#ew-nojit", { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "sine.out" }, 1.55);
      tl.fromTo("#ew-no", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, 1.7);
      tl.fromTo("#ew-caption", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power1.inOut" }, 2.25);
  
      window.__timelines["ebpf-windows"] = tl;
    </script>
  </template>
</body>
</html>
