<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0D1F3C; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0D1F3C; }
      .clip { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="windows-timeline-shot" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div
        id="slot"
        class="clip"
        data-composition-id="windows-timeline"
        data-composition-src="compositions/windows-timeline.html"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["windows-timeline-shot"] = tl;
    </script>
  </body>
</html>
